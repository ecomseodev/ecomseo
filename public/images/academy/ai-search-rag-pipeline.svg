<svg viewBox="0 0 420 190" xmlns="http://www.w3.org/2000/svg" fill="none">
  <text x="210" y="20" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#a78bfa">RAG Pipeline: How AI Search Works</text>
  <!-- Query -->
  <rect x="10" y="42" width="80" height="40" rx="10" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="50" y="58" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#38bdf8">User Query</text>
  <text x="50" y="72" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#e2e8f0">"best hiking boot"</text>
  <path d="M95 62 L110 62" stroke="#38bdf8" stroke-width="1.2" marker-end="url(#arA)"/>
  <!-- Retrieval -->
  <rect x="115" y="42" width="90" height="40" rx="10" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="160" y="58" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#a78bfa">Retrieval</text>
  <text x="160" y="72" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#e2e8f0">Traditional signals</text>
  <path d="M210 62 L225 62" stroke="#a78bfa" stroke-width="1.2" marker-end="url(#arB)"/>
  <!-- Candidate pool -->
  <rect x="230" y="42" width="80" height="40" rx="10" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="270" y="58" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#f59e0b">Candidate</text>
  <text x="270" y="72" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#e2e8f0">~50 documents</text>
  <path d="M315 62 L330 62" stroke="#f59e0b" stroke-width="1.2" marker-end="url(#arC)"/>
  <!-- LLM Synthesis -->
  <rect x="335" y="42" width="75" height="40" rx="10" stroke="#34d399" stroke-width="1.2"/>
  <text x="372" y="58" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#34d399">LLM</text>
  <text x="372" y="72" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#e2e8f0">Synthesis</text>
  <!-- What gets you cited -->
  <text x="210" y="105" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#e2e8f0">Citation Selection Factors</text>
  <rect x="15" y="115" width="90" height="30" rx="8" stroke="#34d399" stroke-width="1" stroke-dasharray="3"/>
  <text x="60" y="134" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#34d399">Topical Authority</text>
  <rect x="115" y="115" width="90" height="30" rx="8" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3"/>
  <text x="160" y="134" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#38bdf8">Structured Data</text>
  <rect x="215" y="115" width="90" height="30" rx="8" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3"/>
  <text x="260" y="134" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#a78bfa">First-Party Data</text>
  <rect x="315" y="115" width="90" height="30" rx="8" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3"/>
  <text x="360" y="134" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#f59e0b">Factual Precision</text>
  <!-- Output -->
  <rect x="100" y="158" width="220" height="25" rx="9" stroke="#34d399" stroke-width="1.2"/>
  <text x="210" y="175" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" fill="#34d399">AI Answer cites 3-4 sources with your product page</text>
  <defs>
    <marker id="arA" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#38bdf8"/></marker>
    <marker id="arB" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#a78bfa"/></marker>
    <marker id="arC" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#f59e0b"/></marker>
  </defs>
</svg>