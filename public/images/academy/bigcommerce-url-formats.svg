<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 230" fill="none">
  <text x="210" y="22" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#a78bfa">BigCommerce URL Format Options</text>
  <!-- Option 1 - SEO Optimized -->
  <rect x="30" y="42" width="360" height="40" rx="10" stroke="#34d399" stroke-width="1.2" fill="none"/>
  <text x="45" y="58" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#34d399">SEO-Optimized (Recommended)</text>
  <text x="45" y="72" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">example.com/blue-running-shoes/</text>
  <text x="350" y="65" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#34d399">Flat, clean</text>
  <!-- Option 2 - Short -->
  <rect x="30" y="92" width="360" height="40" rx="10" stroke="#38bdf8" stroke-width="1.2" fill="none"/>
  <text x="45" y="108" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">Short URLs</text>
  <text x="45" y="122" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">example.com/blue-running-shoes/</text>
  <text x="350" y="115" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#38bdf8">Minimal slug</text>
  <!-- Option 3 - Category-pathed -->
  <rect x="30" y="142" width="360" height="40" rx="10" stroke="#f59e0b" stroke-width="1.2" fill="none"/>
  <text x="45" y="158" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#f59e0b">Category-Pathed</text>
  <text x="45" y="172" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">example.com/shoes/running/blue-running-shoes/</text>
  <text x="350" y="158" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#f59e0b">Longer, risk of</text>
  <text x="350" y="168" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#f59e0b">duplicates</text>
  <!-- Comparison -->
  <text x="210" y="204" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">vs. Shopify (forced prefix):</text>
  <text x="210" y="218" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f87171">shopify-store.com/products/blue-running-shoes</text>
</svg>