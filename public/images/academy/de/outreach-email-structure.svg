<svg viewBox="0 0 400 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <text x="200" y="22" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#a78bfa">Defekte Link-Outreach-E-Mail-Struktur</text>
  <rect x="40" y="40" rx="12" width="320" height="42" stroke="#34d399" stroke-width="1.2" fill="none"/>
  <text x="56" y="56" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#34d399">1</text>
  <text x="72" y="56" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#34d399">Echtes Kompliment</text>
  <text x="72" y="72" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#e2e8f0">Verweisen Sie auf bestimmte Inhalte auf ihrer Seite</text>
  <rect x="40" y="92" rx="12" width="320" height="42" stroke="#f87171" stroke-width="1.2" fill="none"/>
  <text x="56" y="108" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f87171">2</text>
  <text x="72" y="108" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f87171">Defekten Link melden</text>
  <text x="72" y="124" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e2e8f0">Genaue URL + Standort auf ihrer Seite</text>
  <rect x="40" y="144" rx="12" width="320" height="42" stroke="#38bdf8" stroke-width="1.2" fill="none"/>
  <text x="56" y="160" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">3</text>
  <text x="72" y="160" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">Schlagen Sie einen Ersatz vor</text>
  <text x="72" y="176" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" fill="#e2e8f0">Was Ihre Seite abdeckt und warum sie zu ihrem Publikum passt</text>
  <text x="200" y="210" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" fill="#f59e0b">Halten Sie weniger als 120 Wörter. Fragen Sie nicht direkt nach einem Link.</text>
</svg>