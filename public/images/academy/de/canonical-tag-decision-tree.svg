<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" fill="none">
  <!-- Title -->
  <text x="340" y="28" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" letter-spacing="0.3" font-weight="700" fill="#a78bfa">Canonical vs. Redirect vs. Noindex Entscheidungsbaum</text>

  <!-- Start node -->
  <rect x="240" y="48" width="200" height="40" rx="12" stroke="#a78bfa" stroke-width="1.2" fill="none"/>
  <text x="340" y="73" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">Doppelte URL erkannt</text>

  <!-- Arrow down -->
  <line x1="340" y1="88" x2="340" y2="118" stroke="#a78bfa" stroke-width="1.2"/>
  <polygon points="334,114 340,124 346,114" fill="#a78bfa"/>

  <!-- Question 1 -->
  <rect x="200" y="124" width="280" height="40" rx="12" stroke="#38bdf8" stroke-width="1.2" fill="none"/>
  <text x="340" y="149" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e2e8f0">Sollen Nutzer beide URLs erreichen?</text>

  <!-- Left branch: NEIN -->
  <line x1="200" y1="144" x2="100" y2="144" stroke="#38bdf8" stroke-width="1.2"/>
  <line x1="100" y1="144" x2="100" y2="188" stroke="#38bdf8" stroke-width="1.2"/>
  <polygon points="94,184 100,194 106,184" fill="#38bdf8"/>
  <text x="148" y="137" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f87171">NEIN</text>

  <!-- 301-Weiterleitung box -->
  <rect x="30" y="196" width="140" height="44" rx="12" stroke="#34d399" stroke-width="1.2" fill="none"/>
  <text x="100" y="214" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700" fill="#34d399">301-Weiterleitung</text>
  <text x="100" y="230" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">Staerkstes Signal</text>

  <!-- Right branch: JA -->
  <line x1="480" y1="144" x2="560" y2="144" stroke="#38bdf8" stroke-width="1.2"/>
  <line x1="560" y1="144" x2="560" y2="188" stroke="#38bdf8" stroke-width="1.2"/>
  <polygon points="554,184 560,194 566,184" fill="#38bdf8"/>
  <text x="495" y="137" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#34d399">JA</text>

  <!-- Question 2 -->
  <rect x="440" y="196" width="240" height="40" rx="12" stroke="#38bdf8" stroke-width="1.2" fill="none"/>
  <text x="560" y="221" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">Soll eine Version ranken?</text>

  <!-- Right-left: JA -->
  <line x1="480" y1="236" x2="420" y2="236" stroke="#38bdf8" stroke-width="1.2"/>
  <line x1="420" y1="236" x2="420" y2="280" stroke="#38bdf8" stroke-width="1.2"/>
  <polygon points="414,276 420,286 426,276" fill="#38bdf8"/>
  <text x="435" y="255" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#34d399">JA</text>

  <!-- Canonical-Tag box -->
  <rect x="340" y="288" width="160" height="44" rx="12" stroke="#a78bfa" stroke-width="1.2" fill="none"/>
  <text x="420" y="306" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700" fill="#a78bfa">Canonical-Tag</text>
  <text x="420" y="322" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">Hinweis, keine Anweisung</text>

  <!-- Right-right: NEIN -->
  <line x1="640" y1="236" x2="640" y2="280" stroke="#38bdf8" stroke-width="1.2"/>
  <polygon points="634,276 640,286 646,276" fill="#38bdf8"/>
  <text x="620" y="255" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f87171">NEIN</text>

  <!-- Noindex box -->
  <rect x="570" y="288" width="140" height="44" rx="12" stroke="#f59e0b" stroke-width="1.2" fill="none"/>
  <text x="640" y="306" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700" fill="#f59e0b">Noindex-Tag</text>
  <text x="640" y="322" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">Aus dem Index entfernen</text>

  <!-- Use cases labels -->
  <text x="100" y="260" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">Alte URLs, Migrationen</text>
  <text x="420" y="348" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">Filter, Varianten, Parameter</text>
  <text x="640" y="348" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">Warenkorb, Suche, Konto</text>
</svg>