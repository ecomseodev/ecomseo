<svg viewBox="0 0 420 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <text x="210" y="22" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#a78bfa">4 Faktoren, die einen Backlink wertvoll machen</text>
  <rect x="20" y="40" rx="12" width="175" height="90" stroke="#a78bfa" stroke-width="1.2" fill="none"/>
