<svg viewBox="0 0 480 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <text x="240" y="22" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#a78bfa">Redirect-Strategie fuer bereinigte Seiten</text>
  <!-- Correct: single hop -->
  <text x="240" y="50" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#34d399">Korrekt: Ein-Sprung-301</text>
  <rect x="30" y="60" width="100" height="35" rx="10" fill="#f87171" opacity="0.1" stroke="#f87171" stroke-width="1.2"/>
  <text x="80" y="82" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#e2e8f0">Alte Seite A</text>
  <line x1="130" y1="78" x2="230" y2="78" stroke="#34d399" stroke-width="2" marker-end="url(#arrRd)"/>
  <text x="180" y="72" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#34d399">301</text>
  <rect x="230" y="60" width="130" height="35" rx="10" fill="#34d399" opacity="0.15" stroke="#34d399" stroke-width="1.2"/>
  <text x="295" y="82" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#34d399">Zielseite (90-99% Linkwert)</text>
  <!-- Wrong: chain -->
  <text x="240" y="120" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f87171">Falsch: Redirect-Kette</text>
  <rect x="10" y="130" width="85" height="35" rx="10" fill="#f87171" opacity="0.1" stroke="#f87171" stroke-width="1.2"/>
  <text x="52" y="152" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#e2e8f0">Seite A</text>
  <line x1="95" y1="148" x2="135" y2="148" stroke="#f87171" stroke-width="1.2" marker-end="url(#arrRdR)"/>
  <rect x="135" y="130" width="85" height="35" rx="10" fill="#f87171" opacity="0.1" stroke="#f87171" stroke-width="1.2"/>
  <text x="177" y="152" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#e2e8f0">Seite B</text>
  <line x1="220" y1="148" x2="260" y2="148" stroke="#f87171" stroke-width="1.2" marker-end="url(#arrRdR)"/>
  <rect x="260" y="130" width="85" height="35" rx="10" fill="#f87171" opacity="0.1" stroke="#f87171" stroke-width="1.2"/>
  <text x="302" y="152" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#e2e8f0">Seite C</text>
  <line x1="345" y1="148" x2="385" y2="148" stroke="#f87171" stroke-width="1.2" marker-end="url(#arrRdR)"/>
  <rect x="385" y="130" width="85" height="35" rx="10" fill="#f59e0b" opacity="0.15" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="427" y="152" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#f59e0b">Ziel</text>
  <text x="240" y="185" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" fill="#f87171">Jeder Sprung verliert Linkwert + fuegt Latenz hinzu</text>
  <!-- Decision guide -->
  <rect x="40" y="200" width="400" height="30" rx="10" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4"/>
  <text x="240" y="220" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" fill="#e2e8f0">Server-Level-Redirects (.htaccess / nginx) | Jeden Redirect nach Deployment testen</text>
  <defs>
    <marker id="arrRd" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#34d399"/></marker>
    <marker id="arrRdR" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#f87171"/></marker>
  </defs>
</svg>
