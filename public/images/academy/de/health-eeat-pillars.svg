  <text x="210" y="183" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" fill="#e2e8f0">Schwache E-E-A-T-Signale können verhindern, dass gut optimierte Seiten Seite eins erreichen</text>
