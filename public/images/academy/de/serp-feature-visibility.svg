    <text x="14" y="30" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#e2e8f0">Reduces organic Pos 1 CTR from ~30% to 15-20%</text>
