  <text x="400" y="118" text-anchor="middle" fill="#f59e0b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="600">Strategie</text>
  <text x="400" y="140" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Kaufratgeber</text>
  <text x="400" y="154" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Vergleiche</text>
  <text x="400" y="168" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Blogbeiträge</text>
  <text x="400" y="182" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Interne Verlinkung</text>

  <!-- Pillar 4 -->
  <rect x="474" y="80" width="120" height="146" rx="10" fill="#1a1a2e" stroke="#f87171" stroke-width="1.2"/>
  <text x="534" y="104" text-anchor="middle" fill="#f87171" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="600">Off-Page</text>
  <text x="534" y="118" text-anchor="middle" fill="#f87171" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="600">SEO</text>
  <text x="534" y="140" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Backlinks</text>
  <text x="534" y="154" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Digitale PR</text>
  <text x="534" y="168" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Markenerwähnungen</text>
  <text x="534" y="182" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Behörde</text>

  <!-- Top label -->
  <text x="132" y="65" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" letter-spacing="0.3" font-weight="600">Beginnen Sie hier</text>
  <line x1="132" y1="68" x2="132" y2="78" stroke="#34d399" stroke-width="1"/>
  <polygon points="128,76 132,82 136,76" fill="#34d399"/>

  <text x="340" y="286" text-anchor="middle" fill="#64748b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7">Alle vier Säulen wirken zusammen. Beginnen Sie mit technischem SEO, um alles andere freizugeben.</text>
</svg>
