<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" fill="none">
  <!-- Title -->
  <text x="340" y="24" text-anchor="middle" fill="#a78bfa" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" letter-spacing="0.3" font-weight="700">Die vier Säulen der E-Commerce-SEO</text>

  <!-- Foundation bar -->
  <rect x="60" y="230" width="560" height="36" rx="10" fill="#1a1a2e" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="340" y="252" text-anchor="middle" fill="#a78bfa" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="600">Umsatzwachstum durch organische Suche</text>

  <!-- Pillar 1 -->
  <rect x="72" y="80" width="120" height="146" rx="10" fill="#1a1a2e" stroke="#34d399" stroke-width="1.2"/>
  <text x="132" y="104" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="600">Technisch</text>
  <text x="132" y="118" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="600">SEO</text>
  <text x="132" y="140" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Kriechbarkeit</text>
  <text x="132" y="154" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Seitengeschwindigkeit</text>
  <text x="132" y="168" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Strukturierte Daten</text>
  <text x="132" y="182" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Indexierung</text>
  <text x="132" y="210" text-anchor="middle" fill="#334155" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">STIFTUNG</text>

  <!-- Pillar 2 -->
  <rect x="206" y="80" width="120" height="146" rx="10" fill="#1a1a2e" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="266" y="104" text-anchor="middle" fill="#38bdf8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="600">On-Page</text>
  <text x="266" y="118" text-anchor="middle" fill="#38bdf8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="600">SEO</text>
  <text x="266" y="140" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Schlüsselwörter</text>
  <text x="266" y="154" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Titel-Tags</text>
  <text x="266" y="168" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Beschreibungen</text>
