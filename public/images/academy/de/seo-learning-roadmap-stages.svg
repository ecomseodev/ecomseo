  <text x="340" y="316" text-anchor="middle" fill="#64748b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Etablierte Shops können bei einzelnen Seiten bereits nach 6-12 Wochen Ergebnisse sehen</text>
