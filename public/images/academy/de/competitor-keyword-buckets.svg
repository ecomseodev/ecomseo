  <text x="340" y="280" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Führen Sie die Gap-Analyse pro Wettbewerber einzeln durch. Vierteljährlich wiederholen.</text>
