<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" fill="none">
  <text x="340" y="24" text-anchor="middle" fill="#a78bfa" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" letter-spacing="0.3" font-weight="700">Facettierte Navigation: URL-Strategie</text>

  <!-- Category page -->
  <rect x="230" y="44" width="220" height="32" rx="10" fill="#1e1e3a" stroke="#34d399" stroke-width="1.2"/>
  <text x="340" y="64" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" letter-spacing="0.3" font-weight="600">/schuhe/laufen</text>

  <!-- Arrow down -->
  <line x1="340" y1="76" x2="340" y2="96" stroke="#475569" stroke-width="1"/>
  <text x="340" y="92" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" dy="-3">Filter angewendet</text>

  <!-- Two paths -->
  <line x1="260" y1="96" x2="160" y2="120" stroke="#f87171" stroke-width="1"/>
  <line x1="420" y1="96" x2="520" y2="120" stroke="#34d399" stroke-width="1"/>

  <!-- BAD path -->
  <rect x="30" y="120" width="260" height="32" rx="10" fill="#1a1a2e" stroke="#f87171" stroke-width="1.2"/>
  <text x="160" y="140" text-anchor="middle" fill="#f87171" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing="0.3" font-weight="600">/schuhe/laufen?farbe=blau&amp;groesse=42</text>

  <text x="160" y="162" text-anchor="middle" fill="#f87171" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="600">Noindex + Canonical zur Elternseite</text>
  <text x="160" y="176" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Geringe Suchvolumen-Filterkombination</text>
  <text x="160" y="188" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Würde 1000e dünne Seiten erzeugen</text>

  <!-- GOOD path -->
  <rect x="390" y="120" width="260" height="32" rx="10" fill="#1a1a2e" stroke="#34d399" stroke-width="1.2"/>
  <text x="520" y="140" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing="0.3" font-weight="600">/schuhe/schwarze-lederstiefel</text>

  <text x="520" y="162" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="600">Indexierbare Unterkategorieseite</text>
  <text x="520" y="176" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Hohes Suchvolumen-Keyword</text>
  <text x="520" y="188" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Einzigartiger Content + eigene URL</text>

  <!-- Crawl math box -->
  <rect x="80" y="210" width="520" height="50" rx="10" fill="#1a1a2e" stroke="#334155" stroke-width="1"/>
  <text x="340" y="230" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing="0.3" font-weight="600">Crawl-Rechnung: 5 Größen x 8 Farben x 10 Marken = 400 Filter-URLs pro Kategorie</text>
  <text x="340" y="248" text-anchor="middle" fill="#f59e0b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">50 Kategorien x 400 URLs = 20.000 minderwertige Seiten verschwenden Crawl-Budget</text>

  <!-- Legend -->
  <rect x="190" y="275" width="10" height="10" rx="6" fill="none" stroke="#f87171" stroke-width="1.2"/>
  <text x="206" y="284" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Blockieren / Canonical</text>
  <rect x="370" y="275" width="10" height="10" rx="6" fill="none" stroke="#34d399" stroke-width="1.2"/>
  <text x="386" y="284" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Als Unterkategorie indexieren</text>
</svg>