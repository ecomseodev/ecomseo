<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" fill="none">
  <!-- Title -->
  <text x="340" y="24" text-anchor="middle" fill="#a78bfa" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" letter-spacing="0.3" font-weight="700">Intention entlang der Buyer Journey</text>

  <!-- Stage boxes with arrows -->
  <!-- Awareness -->
  <rect x="30" y="54" width="190" height="80" rx="12" fill="#1a1a2e" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="125" y="74" text-anchor="middle" fill="#38bdf8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700">Bewusstsein</text>
  <text x="125" y="92" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">"was bedeutet</text>
  <text x="125" y="104" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Fadenzahl bei Bettwäsche"</text>
  <text x="125" y="124" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Blogbeiträge &amp; Ratgeber</text>

  <!-- Arrow 1 -->
  <line x1="222" y1="94" x2="242" y2="94" stroke="#475569" stroke-width="1.2"/>
  <polygon points="239,89 249,94 239,99" fill="#475569"/>

  <!-- Consideration -->
  <rect x="250" y="54" width="190" height="80" rx="12" fill="#1a1a2e" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="345" y="74" text-anchor="middle" fill="#f59e0b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700">Überlegung</text>
  <text x="345" y="92" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">"beste ägyptische</text>
  <text x="345" y="104" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Baumwoll-Bettwäsche"</text>
  <text x="345" y="124" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Kategorie- &amp; Vergleichsseiten</text>

  <!-- Arrow 2 -->
  <line x1="442" y1="94" x2="462" y2="94" stroke="#475569" stroke-width="1.2"/>
  <polygon points="459,89 469,94 459,99" fill="#475569"/>

  <!-- Decision -->
  <rect x="470" y="54" width="190" height="80" rx="12" fill="#1a1a2e" stroke="#34d399" stroke-width="1.2"/>
  <text x="565" y="74" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700">Entscheidung</text>
  <text x="565" y="92" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">"Brooklinen Luxus</text>
  <text x="565" y="104" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Bettwäsche-Set King kaufen"</text>
  <text x="565" y="124" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Produktseiten</text>

  <!-- Conversion rates -->
  <text x="125" y="155" text-anchor="middle" fill="#38bdf8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="600">&lt;1% Conversion</text>
  <text x="345" y="155" text-anchor="middle" fill="#f59e0b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="600">2-4% Conversion</text>
  <text x="565" y="155" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="600">5-10% Conversion</text>

  <!-- Internal linking arrow -->
  <rect x="100" y="180" width="480" height="32" rx="10" fill="#a78bfa" fill-opacity="0.06" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="340" y="200" text-anchor="middle" fill="#a78bfa" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" letter-spacing="0.3" font-weight="600">Interne Links verbinden die Phasen: Blog → Kategorie → Produkt</text>

  <!-- Bottom note -->
  <text x="340" y="240" text-anchor="middle" fill="#64748b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7">Erstellen Sie Inhalte für jede Phase und verlinken Sie diese untereinander, um Kunden durch die gesamte Buyer Journey zu begleiten</text>
</svg>