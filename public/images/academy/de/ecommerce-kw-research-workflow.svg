<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" fill="none">
  <text x="340" y="24" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" letter-spacing="0.3" font-weight="700" fill="#a78bfa">E-Commerce-Keyword-Recherche-Workflow</text>
  <!-- Step 1 -->
  <rect x="20" y="50" width="150" height="70" rx="12" stroke="#a78bfa" stroke-width="1.2" fill="#a78bfa" fill-opacity="0.08"/>
  <text x="95" y="72" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700" fill="#a78bfa">Schritt 1</text>
  <text x="95" y="90" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">Auditieren Sie Bio</text>
  <text x="95" y="104" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">Leistung (GSC)</text>
  <!-- Arrow 1 -->
  <path d="M170 85 L195 85" stroke="#a78bfa" stroke-width="1.2" marker-end="url(#arrowV)"/>
  <!-- Step 2 -->
  <rect x="200" y="50" width="150" height="70" rx="12" stroke="#38bdf8" stroke-width="1.2" fill="#38bdf8" fill-opacity="0.08"/>
  <text x="275" y="72" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700" fill="#38bdf8">Schritt 2</text>
  <text x="275" y="90" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#e2e8f0">Erstellen Sie eine Seed-Liste</text>
  <text x="275" y="104" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">3 Quellen</text>
  <!-- Arrow 2 -->
  <path d="M350 85 L375 85" stroke="#38bdf8" stroke-width="1.2" marker-end="url(#arrowV)"/>
  <!-- Step 3 -->
  <rect x="380" y="50" width="150" height="70" rx="12" stroke="#34d399" stroke-width="1.2" fill="#34d399" fill-opacity="0.08"/>
  <text x="455" y="72" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700" fill="#34d399">Schritt 3</text>
  <text x="455" y="90" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e2e8f0">Erweitern &amp;amp; Filter</text>
  <text x="455" y="104" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">Kommerzielle Absicht</text>
  <!-- Arrow 3 -->
  <path d="M530 85 L555 85" stroke="#34d399" stroke-width="1.2" marker-end="url(#arrowV)"/>
  <!-- Step 4 -->
  <rect x="560" y="50" width="100" height="70" rx="12" stroke="#f59e0b" stroke-width="1.2" fill="#f59e0b" fill-opacity="0.08"/>
  <text x="610" y="72" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700" fill="#f59e0b">Schritt 4</text>
  <text x="610" y="90" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">Priorisieren</text>
  <text x="610" y="104" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">nach Umsatz</text>
  <!-- Source boxes under Step 2 -->
  <rect x="195" y="145" width="100" height="36" rx="10" stroke="#38bdf8" stroke-width="1" fill="#38bdf8" fill-opacity="0.05"/>
  <text x="245" y="166" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#e2e8f0">Site-Suchdaten</text>
  <rect x="305" y="145" width="100" height="36" rx="10" stroke="#38bdf8" stroke-width="1" fill="#38bdf8" fill-opacity="0.05"/>
  <text x="355" y="166" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#e2e8f0">GSC-Abfragen</text>
  <rect x="415" y="145" width="115" height="36" rx="10" stroke="#38bdf8" stroke-width="1" fill="#38bdf8" fill-opacity="0.05"/>
  <text x="472" y="166" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#e2e8f0">Mitbewerber-Keywords</text>
  <!-- Lines from sources to Step 2 -->
  <line x1="245" y1="145" x2="260" y2="120" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="355" y1="145" x2="290" y2="120" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="472" y1="145" x2="310" y2="120" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Scoring axes under Step 4 -->
  <rect x="30" y="210" width="190" height="90" rx="12" stroke="#f59e0b" stroke-width="1" fill="#f59e0b" fill-opacity="0.05"/>
  <text x="125" y="232" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700" fill="#f59e0b">Umsatz-Score-Formel</text>
  <text x="125" y="254" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">Volumen x Conv.-Rate x AOV</text>
  <text x="125" y="272" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#94a3b8">+ Aktueller Rang + Inhaltslücke</text>
  <text x="125" y="290" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94a3b8">= Prioritätspunktzahl</text>
  <!-- Tag labels -->
  <rect x="260" y="220" width="78" height="28" rx="14" stroke="#34d399" stroke-width="1" fill="#34d399" fill-opacity="0.1"/>
  <text x="299" y="238" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#34d399">Produkt</text>
  <rect x="348" y="220" width="78" height="28" rx="14" stroke="#38bdf8" stroke-width="1" fill="#38bdf8" fill-opacity="0.1"/>
  <text x="387" y="238" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#38bdf8">Kategorie</text>
  <rect x="436" y="220" width="78" height="28" rx="14" stroke="#a78bfa" stroke-width="1" fill="#a78bfa" fill-opacity="0.1"/>
  <text x="475" y="238" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#a78bfa">Inhalt</text>
  <text x="387" y="270" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#94a3b8">Markieren Sie jedes Schlüsselwort nach Seitentyp</text>
  <defs>
    <marker id="arrowV" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#a78bfa" stroke-width="1"/>
    </marker>
  </defs>
</svg>