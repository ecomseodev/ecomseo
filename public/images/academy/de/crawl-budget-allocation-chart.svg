  <!-- Fix arrow -->
  <text x="200" y="148" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#34d399">Fix: Facettierte URLs blockieren &amp;#8594; Leiten Sie das Budget auf Produkte um</text>
  <!-- Target -->
  <rect x="80" y="160" width="240" height="28" rx="9" stroke="#34d399" stroke-width="1.2" stroke-dasharray="4"/>
  <text x="200" y="178" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#e2e8f0">Ziel: 60 % Produkte | 15 % Kategorien | 25 % andere</text>
