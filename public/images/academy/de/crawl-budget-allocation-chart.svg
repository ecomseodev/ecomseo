  <text x="120" y="73" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#38bdf8">10 %</text>
  <text x="30" y="94" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#e2e8f0" text-anchor="end">Facetten</text>
  <rect x="35" y="84" width="300" height="14" rx="6" fill="#f87171" opacity="0.2"/>
  <rect x="35" y="84" width="300" height="14" rx="6" stroke="#f87171" stroke-width="1" fill="none"/>
  <text x="340" y="95" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#f87171">60 % ABFALL</text>
  <text x="30" y="116" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#e2e8f0" text-anchor="end">Andere</text>
  <rect x="35" y="106" width="100" height="14" rx="6" fill="#f59e0b" opacity="0.2"/>
