<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260" fill="none">
  <text x="210" y="22" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#a78bfa">Modèle de duplication d'URL Shopify</text>
  <!-- Canonical URL -->
  <rect x="110" y="40" width="200" height="34" rx="10" stroke="#34d399" stroke-width="1.2" fill="none"/>
  <text x="210" y="55" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#34d399">Canonique (primaire)</text>
  <text x="210" y="68" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#e2e8f0">/produits/baskets-bleues</text>
  <!-- Duplicate URLs -->
  <rect x="20" y="110" width="175" height="34" rx="10" stroke="#f59e0b" stroke-width="1.2" fill="none"/>
  <text x="107" y="125" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f59e0b">Double</text>
  <text x="107" y="138" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6" fill="#e2e8f0">/collections/chaussures/produits/baskets-bleues</text>
  <rect x="225" y="110" width="175" height="34" rx="10" stroke="#f59e0b" stroke-width="1.2" fill="none"/>
  <text x="312" y="125" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f59e0b">Double</text>
  <text x="312" y="138" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" fill="#e2e8f0">/collections/ventes/produits/baskets-bleues</text>
  <!-- Arrows pointing up to canonical -->
  <line x1="107" y1="110" x2="180" y2="74" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4,3"/>
  <polygon points="180,74 174,80 178,82" fill="#a78bfa"/>
  <line x1="312" y1="110" x2="240" y2="74" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4,3"/>
  <polygon points="240,74 242,82 246,80" fill="#a78bfa"/>
  <!-- Labels -->
  <text x="100" y="96" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#a78bfa">balise canonique</text>
  <text x="320" y="96" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#a78bfa">balise canonique</text>
  <!-- Tip box -->
  <rect x="40" y="165" width="340" height="44" rx="10" stroke="#38bdf8" stroke-width="1" fill="none"/>
  <text x="210" y="182" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="bold" fill="#38bdf8">Shopify gère cela automatiquement</text>
  <text x="210" y="196" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" fill="#e2e8f0">Vérifiez les balises canoniques dans l’outil d’inspection d’URL de la Search Console.</text>
  <text x="210" y="206" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" fill="#e2e8f0">Les conflits d'applications ou les modifications de thème peuvent les remplacer.</text>
  <!-- Legend -->
  <rect x="120" y="228" width="8" height="8" rx="6" fill="#34d399"/>
  <text x="133" y="236" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#e2e8f0">URL principale</text>
  <rect x="200" y="228" width="8" height="8" rx="6" fill="#f59e0b"/>
  <text x="213" y="236" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" fill="#e2e8f0">Doublons de contexte de collection</text>
</svg>