<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" fill="none">
  <!-- Title -->
  <text x="340" y="24" text-anchor="middle" fill="#a78bfa" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" letter-spacing="0.3" font-weight="700">Les quatre types d'intention de recherche</text>

  <!-- Funnel stages -->
  <!-- Informational -->
  <rect x="40" y="50" width="600" height="56" rx="12" fill="#1a1a2e" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="80" y="74" fill="#38bdf8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700">Informatif</text>
  <text x="80" y="92" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7">"comment choisir des chaussures de course"</text>
  <text x="460" y="74" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Articles de blog, guides</text>
  <text x="460" y="92" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7">Conversion : &amp;lt;1 % | Sensibilise</text>

  <!-- Commercial -->
  <rect x="80" y="118" width="520" height="56" rx="12" fill="#1a1a2e" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="120" y="142" fill="#f59e0b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700">Commercial</text>
  <text x="120" y="160" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">"meilleures chaussures de course 2025"</text>
  <text x="440" y="142" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Comparatifs, pages de catégories</text>
  <text x="440" y="160" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7">Conversion : 2-4 % | Évaluation des options</text>

  <!-- Transactional -->
  <rect x="120" y="186" width="440" height="56" rx="12" fill="#1a1a2e" stroke="#34d399" stroke-width="1.2"/>
  <text x="160" y="210" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700">Transactionnel</text>
  <text x="160" y="228" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">"acheter des Nike Air Max 90"</text>
  <text x="420" y="210" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Pages produits</text>
  <text x="420" y="228" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7">Conversion : 5-10 % | Prêt à acheter</text>

  <!-- Navigational -->
  <rect x="160" y="254" width="360" height="56" rx="12" fill="#1a1a2e" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="200" y="278" fill="#a78bfa" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700">Navigation</text>
  <text x="200" y="296" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">"Magasin Nike" / "Soins plus brillants"</text>
  <text x="420" y="278" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Marques/pages d'accueil</text>
  <text x="420" y="296" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7">Intention la plus élevée | Marque déjà choisie</text>

  <!-- Right side arrow label -->
  <text x="660" y="145" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" text-anchor="middle" transform="rotate(90,660,145)">Intention d'achat plus élevée</text>
  <line x1="652" y1="60" x2="652" y2="300" stroke="#475569" stroke-width="1"/>
  <polygon points="648,295 652,305 656,295" fill="#475569"/>

  <text x="340" y="332" text-anchor="middle" fill="#64748b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7">Faites correspondre chaque type d'intention avec le bon type de page pour un classement et des conversions maximaux</text>
</svg>
