<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" fill="none">
  <!-- Title -->
  <text x="340" y="24" text-anchor="middle" fill="#a78bfa" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" letter-spacing="0.3" font-weight="700">Processus de rendu en deux phases de Google</text>

  <!-- Phase 1 Box -->
  <rect x="20" y="44" width="300" height="220" rx="10" fill="#1a1a2e" stroke="#f87171" stroke-width="1" stroke-opacity="0.5"/>
  <rect x="20" y="44" width="300" height="30" rx="10" fill="#f87171" fill-opacity="0.1"/>
  <rect x="20" y="64" width="300" height="1" fill="#f87171" fill-opacity="0.2"/>
  <text x="170" y="64" text-anchor="middle" fill="#f87171" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" letter-spacing="0.3" font-weight="700">PHASE 1 : Récupération HTML</text>

  <text x="170" y="90" text-anchor="middle" fill="#64748b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Se produit immédiatement</text>

  <!-- What Google receives -->
  <rect x="40" y="105" width="260" height="50" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="170" y="123" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="12">&amp;lt;html&amp;gt;&amp;lt;corps&amp;gt;</text>
  <text x="170" y="143" text-anchor="middle" fill="#475569" font-family="monospace" font-size="12">&amp;lt;div id="app"&amp;gt;&amp;lt;/div&amp;gt;</text>

  <!-- What's missing -->
  <rect x="40" y="168" width="260" height="36" rx="10" fill="#f87171" fill-opacity="0.08" stroke="#f87171" stroke-width="0.8"/>
  <text x="170" y="183" text-anchor="middle" fill="#f87171" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Pas de titre, pas de prix, pas de description</text>
  <text x="170" y="196" text-anchor="middle" fill="#f87171" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Aucun avis, aucun balisage de schéma</text>

  <!-- Result -->
  <rect x="40" y="216" width="260" height="32" rx="10" fill="#f87171" fill-opacity="0.15" stroke="#f87171" stroke-width="1"/>
  <text x="170" y="237" text-anchor="middle" fill="#f87171" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" letter-spacing="0.3" font-weight="700">Google voit : PAGE VIDE</text>

  <!-- Arrow between phases -->
  <line x1="330" y1="154" x2="350" y2="154" stroke="#a78bfa" stroke-width="2"/>
  <polygon points="348,148 360,154 348,160" fill="#a78bfa"/>
  <text x="345" y="178" text-anchor="middle" fill="#f59e0b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing="0.3" font-weight="600">jours pour</text>
  <text x="345" y="192" text-anchor="middle" fill="#f59e0b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing="0.3" font-weight="600">semaines</text>

  <!-- Phase 2 Box -->
  <rect x="360" y="44" width="300" height="220" rx="10" fill="#1a1a2e" stroke="#34d399" stroke-width="1" stroke-opacity="0.5"/>
  <rect x="360" y="44" width="300" height="30" rx="10" fill="#34d399" fill-opacity="0.1"/>
  <rect x="360" y="64" width="300" height="1" fill="#34d399" fill-opacity="0.2"/>
  <text x="510" y="64" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" letter-spacing="0.3" font-weight="700">PHASE 2 : Rendu JS</text>

  <text x="510" y="90" text-anchor="middle" fill="#64748b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Retardé (file d'attente de rendu)</text>

  <!-- What Google renders -->
  <rect x="380" y="105" width="260" height="50" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="510" y="123" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="12">&amp;lt;h1&amp;gt;Chaussures de course Pro&amp;lt;/h1&amp;gt;</text>
  <text x="510" y="143" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="12">&amp;lt;span&amp;gt;129,99 $&amp;lt;/span&amp;gt; En stock</text>

  <!-- What's visible -->
  <rect x="380" y="168" width="260" height="36" rx="10" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="0.8"/>
  <text x="510" y="183" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Titre, prix, description chargés</text>
  <text x="510" y="196" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Avis, schéma, images rendues</text>

  <!-- Result -->
  <rect x="380" y="216" width="260" height="32" rx="10" fill="#34d399" fill-opacity="0.15" stroke="#34d399" stroke-width="1"/>
  <text x="510" y="237" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" letter-spacing="0.3" font-weight="700">Google voit : CONTENU COMPLET</text>

  <!-- Solution bar -->
  <rect x="80" y="282" width="520" height="36" rx="12" fill="#a78bfa" fill-opacity="0.1" stroke="#a78bfa" stroke-width="1"/>
  <text x="340" y="300" text-anchor="middle" fill="#a78bfa" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" letter-spacing="0.3" font-weight="700">Solution : rendu côté serveur (SSR) ou génération statique (SSG)</text>
  <text x="340" y="313" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Élimine le retard de la phase 2. Google obtient le contenu complet dès la première récupération.</text>

  <text x="340" y="336" text-anchor="middle" fill="#64748b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Shopify Liquid = SSR par défaut | Next.js/Nuxt = configurer SSR ou SSG | React SPA = doit être réparé</text>
</svg>
