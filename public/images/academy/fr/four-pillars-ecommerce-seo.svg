  <!-- Top label -->
  <text x="132" y="65" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" letter-spacing="0.3" font-weight="600">Commencez ici</text>
  <line x1="132" y1="68" x2="132" y2="78" stroke="#34d399" stroke-width="1"/>
  <polygon points="128,76 132,82 136,76" fill="#34d399"/>

  <text x="340" y="286" text-anchor="middle" fill="#64748b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7">Les quatre piliers fonctionnent ensemble. Commencez par le référencement technique pour débloquer tout le reste.</text>
