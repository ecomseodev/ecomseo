<svg viewBox="0 0 480 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <text x="240" y="22" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#a78bfa">Comment l'UGC génère de la valeur SEO</text>
  <!-- UGC types on left -->
  <rect x="20" y="50" width="120" height="30" rx="10" fill="#a78bfa" opacity="0.15" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="80" y="70" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#a78bfa">Avis</text>
  <rect x="20" y="90" width="120" height="30" rx="10" fill="#38bdf8" opacity="0.15" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="80" y="110" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#38bdf8">Sections de questions et réponses</text>
  <rect x="20" y="130" width="120" height="30" rx="10" fill="#34d399" opacity="0.15" stroke="#34d399" stroke-width="1.2"/>
  <text x="80" y="150" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#34d399">Photos des clients</text>
  <!-- Arrows to center -->
  <line x1="140" y1="65" x2="190" y2="105" stroke="#a78bfa" stroke-width="1.2"/>
  <line x1="140" y1="105" x2="190" y2="105" stroke="#38bdf8" stroke-width="1.2"/>
  <line x1="140" y1="145" x2="190" y2="105" stroke="#34d399" stroke-width="1.2"/>
  <!-- Center: Product Page -->
  <rect x="190" y="75" width="100" height="60" rx="10" fill="#a78bfa" opacity="0.2" stroke="#a78bfa" stroke-width="2"/>
  <text x="240" y="100" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#a78bfa">Produit</text>
  <text x="240" y="115" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#a78bfa">Page</text>
  <!-- SEO outputs on right -->
  <line x1="290" y1="85" x2="340" y2="60" stroke="#e2e8f0" stroke-width="1.2"/>
  <line x1="290" y1="100" x2="340" y2="100" stroke="#e2e8f0" stroke-width="1.2"/>
  <line x1="290" y1="115" x2="340" y2="140" stroke="#e2e8f0" stroke-width="1.2"/>
  <line x1="290" y1="125" x2="340" y2="180" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="350" y="64" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#34d399">Contenu unique</text>
  <text x="350" y="104" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#38bdf8">Mots-clés à longue traîne</text>
  <text x="350" y="144" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#f59e0b">Signaux de fraîcheur</text>
  <text x="350" y="184" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#a78bfa">Extraits enrichis (étoiles)</text>
  <!-- Bottom stats -->
  <rect x="40" y="200" width="400" height="40" rx="12" fill="none" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4"/>
  <text x="240" y="218" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#34d399">30 avis = des centaines de mots uniques | CTR 15 à 25 % plus élevé avec des extraits enrichis</text>
  <text x="240" y="232" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e2e8f0">Les soumissions continues maintiennent les pages à jour pour Google</text>
</svg>
