<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" fill="none">
  <text x="340" y="24" text-anchor="middle" fill="#a78bfa" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" letter-spacing="0.3" font-weight="700">Hiérarchie de titres correcte pour une page de produit</text>

  <!-- H1 -->
  <rect x="140" y="44" width="400" height="32" rx="10" fill="#1e1e3a" stroke="#a78bfa" stroke-width="2"/>
  <text x="160" y="64" fill="#a78bfa" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" letter-spacing="0.3" font-weight="700">H1</text>
  <text x="200" y="64" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Botte de randonnée imperméable homme - Cuir marron</text>

  <!-- H2: Description -->
  <line x1="200" y1="76" x2="200" y2="90" stroke="#475569" stroke-width="1"/>
  <rect x="200" y="90" width="340" height="28" rx="9" fill="#1a1a2e" stroke="#34d399" stroke-width="1.2"/>
  <text x="220" y="108" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" letter-spacing="0.3" font-weight="600">Description du produit H2</text>

  <!-- H2: Specifications -->
  <line x1="200" y1="118" x2="200" y2="130" stroke="#475569" stroke-width="1"/>
  <rect x="200" y="130" width="340" height="28" rx="9" fill="#1a1a2e" stroke="#34d399" stroke-width="1.2"/>
  <text x="220" y="148" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" letter-spacing="0.3" font-weight="600">Spécifications H2</text>

  <!-- H3s under Specifications -->
  <line x1="260" y1="158" x2="260" y2="168" stroke="#475569" stroke-width="0.8"/>
  <rect x="260" y="168" width="240" height="22" rx="8" fill="#1a1a2e" stroke="#38bdf8" stroke-width="1"/>
  <text x="280" y="183" fill="#38bdf8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Dimensions et dimensions H3 Poids</text>

  <line x1="260" y1="190" x2="260" y2="196" stroke="#475569" stroke-width="0.8"/>
  <rect x="260" y="196" width="240" height="22" rx="8" fill="#1a1a2e" stroke="#38bdf8" stroke-width="1"/>
  <text x="280" y="211" fill="#38bdf8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Matériaux et matériaux H3 Construction</text>

  <line x1="260" y1="218" x2="260" y2="224" stroke="#475569" stroke-width="0.8"/>
  <rect x="260" y="224" width="240" height="22" rx="8" fill="#1a1a2e" stroke="#38bdf8" stroke-width="1"/>
  <text x="280" y="239" fill="#38bdf8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Instructions d'entretien H3</text>

  <!-- H2: Reviews -->
  <line x1="200" y1="246" x2="200" y2="258" stroke="#475569" stroke-width="1"/>
  <rect x="200" y="258" width="340" height="28" rx="9" fill="#1a1a2e" stroke="#34d399" stroke-width="1.2"/>
  <text x="220" y="276" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" letter-spacing="0.3" font-weight="600">Avis clients H2 (48)</text>

  <!-- H2: Related -->
  <line x1="200" y1="286" x2="200" y2="296" stroke="#475569" stroke-width="1"/>
  <rect x="200" y="296" width="340" height="28" rx="9" fill="#1a1a2e" stroke="#34d399" stroke-width="1.2"/>
  <text x="220" y="314" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" letter-spacing="0.3" font-weight="600">Produits liés au H2</text>

  <!-- Level indicators on left -->
  <text x="130" y="64" text-anchor="end" fill="#a78bfa" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Niveau 1</text>
  <text x="190" y="108" text-anchor="end" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Niveau 2</text>
  <text x="250" y="183" text-anchor="end" fill="#38bdf8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Niveau 3</text>

  <text x="340" y="338" text-anchor="middle" fill="#64748b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Ne sautez jamais les niveaux (H1 à H3) et n'utilisez jamais de balises de titre pour le style visuel</text>
</svg>