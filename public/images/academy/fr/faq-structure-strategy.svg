<svg viewBox="0 0 480 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <text x="240" y="22" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#a78bfa">Architecture de contenu des FAQ</text>
  <!-- Top: Category FAQ pages -->
  <rect x="140" y="45" width="200" height="40" rx="12" fill="#a78bfa" opacity="0.15" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="240" y="70" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#a78bfa">Pages FAQ de la catégorie</text>
  <!-- Split into specific pages -->
  <line x1="170" y1="85" x2="80" y2="115" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="240" y1="85" x2="240" y2="115" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="310" y1="85" x2="400" y2="115" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="20" y="115" width="120" height="45" rx="10" fill="#38bdf8" opacity="0.12" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="80" y="135" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#38bdf8">Livraison et livraison</text>
  <text x="80" y="148" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#38bdf8">FAQ sur l'assemblage</text>
  <rect x="180" y="115" width="120" height="45" rx="10" fill="#34d399" opacity="0.12" stroke="#34d399" stroke-width="1.2"/>
  <text x="240" y="135" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#34d399">Matériaux et amp;</text>
  <text x="240" y="148" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#34d399">FAQ sur les soins</text>
  <rect x="340" y="115" width="120" height="45" rx="10" fill="#f59e0b" opacity="0.12" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="400" y="135" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#f59e0b">Retours et retours</text>
  <text x="400" y="148" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#f59e0b">FAQ sur les échanges</text>
  <!-- Bottom: Product-level FAQs -->
  <line x1="240" y1="160" x2="240" y2="185" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4"/>
  <rect x="100" y="185" width="280" height="40" rx="12" fill="#a78bfa" opacity="0.08" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4"/>
  <text x="240" y="210" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e2e8f0">FAQ au niveau du produit (3 à 5 questions par page de produit)</text>
  <!-- Annotation -->
  <text x="240" y="245" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e2e8f0">Réponses : 80 à 150 mots chacune | FAQPage JSON-LD sur chaque page</text>
</svg>
