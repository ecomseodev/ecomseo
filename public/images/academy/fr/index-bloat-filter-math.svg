<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" fill="none">
  <!-- Title -->
  <text x="340" y="24" text-anchor="middle" fill="#a78bfa" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" letter-spacing="0.3" font-weight="700">Gonflement de l'index : comment les filtres multiplient les URL</text>

  <!-- Category box -->
  <rect x="240" y="44" width="200" height="32" rx="10" fill="#1a1a2e" stroke="#34d399" stroke-width="1.2"/>
  <text x="340" y="64" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="600">/canapés (200 produits)</text>

  <!-- Lines to filters -->
  <line x1="260" y1="76" x2="100" y2="110" stroke="#475569" stroke-width="1"/>
  <line x1="310" y1="76" x2="250" y2="110" stroke="#475569" stroke-width="1"/>
  <line x1="370" y1="76" x2="400" y2="110" stroke="#475569" stroke-width="1"/>
  <line x1="420" y1="76" x2="550" y2="110" stroke="#475569" stroke-width="1"/>

  <!-- Filter boxes -->
  <rect x="30" y="110" width="140" height="28" rx="9" fill="#1a1a2e" stroke="#38bdf8" stroke-width="1"/>
  <text x="100" y="128" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Couleur (10 options)</text>

  <rect x="185" y="110" width="140" height="28" rx="9" fill="#1a1a2e" stroke="#38bdf8" stroke-width="1"/>
  <text x="255" y="128" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Matériel (8 options)</text>

  <rect x="340" y="110" width="140" height="28" rx="9" fill="#1a1a2e" stroke="#38bdf8" stroke-width="1"/>
  <text x="410" y="128" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Prix ​​(5 gammes)</text>

  <rect x="495" y="110" width="140" height="28" rx="9" fill="#1a1a2e" stroke="#38bdf8" stroke-width="1"/>
  <text x="565" y="128" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Sièges (4 options)</text>

  <!-- Multiplication -->
  <text x="340" y="165" text-anchor="middle" fill="#f59e0b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700">10 x 8 x 5 x 4 = 1 600 URL de filtre</text>
  <text x="340" y="180" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7">à partir d'UNE seule catégorie (avant les combinaisons à sélection multiple)</text>

  <!-- Bottom comparison -->
  <rect x="60" y="200" width="250" height="50" rx="10" fill="#f87171" fill-opacity="0.08" stroke="#f87171" stroke-width="1"/>
  <text x="185" y="221" text-anchor="middle" fill="#f87171" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="600">Sans contrôle</text>
  <text x="185" y="240" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7">Plus de 1 600 URL de faible valeur indexées</text>

  <rect x="370" y="200" width="250" height="50" rx="10" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="1"/>
  <text x="495" y="221" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="600">Avec noindex + canonique</text>
  <text x="495" y="240" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7">Seulement 3 à 5 filtres à forte demande indexés</text>

  <text x="340" y="272" text-anchor="middle" fill="#64748b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7">Utilisez robots.txt, noindex et les balises canoniques pour contrôler les combinaisons de filtres que Google indexe</text>
</svg>
