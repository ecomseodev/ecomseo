<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" fill="none">
  <!-- Title -->
  <text x="340" y="24" text-anchor="middle" fill="#a78bfa" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" letter-spacing="0.3" font-weight="700">Prioriser par impact, et non par ordre de liste de contrôle</text>

  <!-- Decision tree -->
  <!-- Root question -->
  <rect x="210" y="44" width="260" height="36" rx="12" fill="#1a1a2e" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="340" y="66" text-anchor="middle" fill="#a78bfa" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" letter-spacing="0.3" font-weight="600">Que montre votre audit ?</text>

  <!-- Branch lines -->
  <line x1="260" y1="80" x2="140" y2="110" stroke="#475569" stroke-width="1"/>
  <line x1="340" y1="80" x2="340" y2="110" stroke="#475569" stroke-width="1"/>
  <line x1="420" y1="80" x2="540" y2="110" stroke="#475569" stroke-width="1"/>

  <!-- Branch 1: Technical issues -->
  <rect x="40" y="110" width="200" height="60" rx="10" fill="#1a1a2e" stroke="#f87171" stroke-width="1.2"/>
  <text x="140" y="132" text-anchor="middle" fill="#f87171" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing="0.3" font-weight="600">40 % des pages renvoient 404 ?</text>
  <text x="140" y="148" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Résoudre les problèmes techniques en PREMIER</text>
  <text x="140" y="162" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">avant toute recherche de mots clés</text>

  <!-- Branch 2: Ranking page 2 -->
  <rect x="250" y="110" width="180" height="60" rx="10" fill="#1a1a2e" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="340" y="132" text-anchor="middle" fill="#f59e0b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing="0.3" font-weight="600">Les pages sont classées à la page 2 ?</text>
  <text x="340" y="148" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Optimisation sur la page</text>
  <text x="340" y="162" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">déplace l'aiguille le plus rapidement</text>

  <!-- Branch 3: No content -->
  <rect x="440" y="110" width="200" height="60" rx="10" fill="#1a1a2e" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="540" y="132" text-anchor="middle" fill="#38bdf8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing="0.3" font-weight="600">Pas de contenu de support ?</text>
  <text x="540" y="148" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Créer du contenu + des liens</text>
  <text x="540" y="162" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">pour la croissance de l'autorité</text>

  <!-- Bottom: common mistake -->
  <rect x="100" y="195" width="480" height="40" rx="12" fill="#f87171" fill-opacity="0.06" stroke="#f87171" stroke-width="1"/>
  <text x="340" y="214" text-anchor="middle" fill="#f87171" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing="0.3" font-weight="600">Erreur courante : accéder au contenu avant de résoudre les problèmes d'exploration/d'indexation</text>
  <text x="340" y="228" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Nous avons vu des équipes rédiger plus de 100 articles de blog alors que Google n'indexait pas leurs pages produits.</text>
</svg>
