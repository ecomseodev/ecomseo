<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" fill="none">
  <text x="210" y="22" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#a78bfa">Couches d'optimisation de vitesse Magento</text>
  <!-- Varnish layer -->
  <rect x="40" y="44" width="340" height="36" rx="10" stroke="#34d399" stroke-width="1.2" fill="none"/>
  <text x="60" y="60" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#34d399">Cache pleine page de vernis</text>
  <text x="60" y="73" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e2e8f0">Impact unique le plus élevé. Sert le HTML mis en cache, contourne PHP.</text>
  <text x="355" y="67" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#34d399">1</text>
  <!-- JS/CSS layer -->
  <rect x="40" y="88" width="340" height="36" rx="10" stroke="#38bdf8" stroke-width="1.2" fill="none"/>
  <text x="60" y="104" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">Fusion JS/CSS + Réduire</text>
  <text x="60" y="117" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e2e8f0">Activez dans Stores &gt; Config &gt; Developer. Ajoutez une inline CSS critique.</text>
  <text x="355" y="111" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#38bdf8">2</text>
  <!-- Image layer -->
  <rect x="40" y="132" width="340" height="36" rx="10" stroke="#f59e0b" stroke-width="1.2" fill="none"/>
  <text x="60" y="148" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#f59e0b">Images WebP + chargement paresseux</text>
  <text x="60" y="161" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e2e8f0">WebP avec solution de repli JPEG. Chargement paresseux sous les grilles de produits pliées.</text>
  <text x="355" y="155" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#f59e0b">3</text>
  <!-- CDN layer -->
  <rect x="40" y="176" width="340" height="36" rx="10" stroke="#a78bfa" stroke-width="1.2" fill="none"/>
  <text x="60" y="192" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#a78bfa">CDN pour les actifs statiques</text>
  <text x="60" y="205" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e2e8f0">Servez des images, CSS, JS à partir de serveurs Edge à proximité des clients.</text>
  <text x="355" y="199" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#a78bfa">4</text>
  <!-- Before/After -->
  <text x="100" y="232" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f87171">Avant : 4 à 8 s de charge</text>
  <line x1="155" y1="228" x2="260" y2="228" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <polygon points="258,225 264,228 258,231" fill="#e2e8f0"/>
  <text x="330" y="232" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#34d399">Après : moins de 2 ans</text>
</svg>