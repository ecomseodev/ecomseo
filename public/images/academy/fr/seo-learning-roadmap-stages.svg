  <text x="380" y="90" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Sur la page</text>
  <text x="380" y="99" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">optimisation</text>

  <text x="450" y="90" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Technique</text>
  <text x="450" y="99" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Référencement</text>

  <text x="520" y="90" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Contenu</text>
  <text x="520" y="99" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">stratégie</text>

  <text x="570" y="90" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Lien</text>
  <text x="570" y="99" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">bâtiment</text>

  <text x="620" y="90" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Mesure</text>
  <text x="620" y="99" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">&amp;amp; répéter</text>

  <!-- Phase boxes below -->
  <rect x="50" y="120" width="210" height="60" rx="10" fill="#1a1a2e" stroke="#34d399" stroke-width="1.2"/>
  <text x="155" y="140" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="600">Fondation (étapes 1 à 3)</text>
  <text x="155" y="156" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">4-6 semaines</text>
  <text x="155" y="170" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7">Comprendre la mécanique, mettre en place des outils, auditer</text>

  <rect x="275" y="120" width="140" height="60" rx="10" fill="#1a1a2e" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="345" y="140" text-anchor="middle" fill="#38bdf8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="600">Optimisation (4-5)</text>
  <text x="345" y="156" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">4-6 semaines</text>
  <text x="345" y="170" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Mots-clés + sur la page</text>

  <rect x="430" y="120" width="140" height="60" rx="10" fill="#1a1a2e" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="500" y="140" text-anchor="middle" fill="#f59e0b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="600">Mise à l'échelle (6-7)</text>
  <text x="500" y="156" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">2-3 mois</text>
  <text x="500" y="170" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Tech + contenu (parallèle)</text>

  <!-- Ongoing banner -->
  <rect x="50" y="200" width="580" height="36" rx="10" fill="#a78bfa" fill-opacity="0.06" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="340" y="222" text-anchor="middle" fill="#a78bfa" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" letter-spacing="0.3" font-weight="600">Étapes 8-9 : Création de liens + mesure (en continu, ne s'arrête jamais)</text>

  <!-- Timeline -->
  <line x1="60" y1="260" x2="620" y2="260" stroke="#334155" stroke-width="1"/>
  <text x="60" y="275" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Mois 1</text>
  <text x="155" y="275" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Mois 2-3</text>
  <text x="300" y="275" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Mois 3-4</text>
  <text x="450" y="275" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Mois 4-6</text>
  <text x="570" y="275" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Mois 6+</text>

  <!-- Result expectation -->
  <text x="340" y="300" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" letter-spacing="0.3" font-weight="600">Première croissance organique significative du trafic : 4 à 8 mois</text>
  <text x="340" y="316" text-anchor="middle" fill="#64748b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7">Les magasins établis peuvent voir des résultats dans 6 à 12 semaines pour des pages spécifiques</text>
  <text x="340" y="332" text-anchor="middle" fill="#64748b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7">Après 12 mois, la recherche organique devient généralement le canal marketing au retour sur investissement le plus élevé</text>
</svg>
