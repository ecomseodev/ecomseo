<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" fill="none">
  <!-- Title -->
  <text x="340" y="24" text-anchor="middle" fill="#a78bfa" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" letter-spacing="0.3" font-weight="700">Le parcours d'apprentissage SEO du commerce électronique en 9 étapes</text>

  <!-- Timeline line -->
  <line x1="60" y1="60" x2="620" y2="60" stroke="#334155" stroke-width="2"/>

  <!-- Stage dots and labels - Row 1 (Stages 1-3) -->
  <circle cx="90" cy="60" r="14" fill="#1a1a2e" stroke="#34d399" stroke-width="2"/>
  <text x="90" y="65" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700">1</text>

  <circle cx="160" cy="60" r="14" fill="#1a1a2e" stroke="#34d399" stroke-width="2"/>
  <text x="160" y="65" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700">2</text>

  <circle cx="230" cy="60" r="14" fill="#1a1a2e" stroke="#34d399" stroke-width="2"/>
  <text x="230" y="65" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700">3</text>

  <!-- Stages 4-5 -->
  <circle cx="310" cy="60" r="14" fill="#1a1a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="310" y="65" text-anchor="middle" fill="#38bdf8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700">4</text>

  <circle cx="380" cy="60" r="14" fill="#1a1a2e" stroke="#38bdf8" stroke-width="2"/>
  <text x="380" y="65" text-anchor="middle" fill="#38bdf8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700">5</text>

  <!-- Stages 6-7 -->
  <circle cx="450" cy="60" r="14" fill="#1a1a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="65" text-anchor="middle" fill="#f59e0b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700">6</text>

  <circle cx="520" cy="60" r="14" fill="#1a1a2e" stroke="#f59e0b" stroke-width="2"/>
  <text x="520" y="65" text-anchor="middle" fill="#f59e0b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700">7</text>

