<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" fill="none">
  <!-- Title -->
  <text x="340" y="24" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" letter-spacing="0.3" font-weight="700" fill="#a78bfa">5 URL, 1 prodotto: perché i Canonical sono importanti</text>

  <!-- Product box center -->
  <rect x="260" y="44" width="160" height="44" rx="10" stroke="#34d399" stroke-width="2" fill="none"/>
  <text x="340" y="63" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" letter-spacing="0.3" font-weight="700" fill="#34d399">Scarpe da corsa blu</text>
  <text x="340" y="78" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Prodotto unico</text>

  <!-- URL boxes -->
  <rect x="10" y="120" width="130" height="50" rx="10" stroke="#38bdf8" stroke-width="1" fill="none"/>
  <text x="75" y="140" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700" fill="#38bdf8">URL diretto</text>
  <text x="75" y="156" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e2e8f0">/prodotti/scarpe-blu</text>

  <rect x="148" y="120" width="130" height="50" rx="10" stroke="#f59e0b" stroke-width="1" fill="none"/>
  <text x="213" y="140" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700" fill="#f59e0b">URL del filtro</text>
  <text x="213" y="156" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e2e8f0">/scarpe?colore=blu</text>

  <rect x="286" y="120" width="130" height="50" rx="10" stroke="#f59e0b" stroke-width="1" fill="none"/>
  <text x="351" y="140" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700" fill="#f59e0b">Cerca URL</text>
  <text x="351" y="156" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e2e8f0">/search?q=blu+scarpe</text>

  <rect x="424" y="120" width="130" height="50" rx="10" stroke="#f59e0b" stroke-width="1" fill="none"/>
  <text x="489" y="140" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700" fill="#f59e0b">URL dell'UTM</text>
  <text x="489" y="156" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e2e8f0">/scarpe-blu?utm_src=em</text>

  <rect x="562" y="120" width="110" height="50" rx="10" stroke="#f59e0b" stroke-width="1" fill="none"/>
  <text x="617" y="140" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700" fill="#f59e0b">URL della sessione</text>
  <text x="617" y="156" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e2e8f0">/scarpe-blu?sid=abc</text>

  <!-- Arrows from product to URLs -->
  <line x1="300" y1="88" x2="75" y2="118" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4"/>
  <line x1="320" y1="88" x2="213" y2="118" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4"/>
  <line x1="340" y1="88" x2="351" y2="118" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4"/>
  <line x1="360" y1="88" x2="489" y2="118" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4"/>
  <line x1="380" y1="88" x2="617" y2="118" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4"/>

  <!-- Canonical arrows -->
  <text x="340" y="200" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" letter-spacing="0.3" font-weight="700" fill="#a78bfa">rel="canonico"</text>
  <line x1="213" y1="170" x2="105" y2="210" stroke="#34d399" stroke-width="1.2"/>
  <polygon points="102,205 105,215 112,208" fill="#34d399"/>
  <line x1="351" y1="170" x2="105" y2="225" stroke="#34d399" stroke-width="1.2"/>
  <line x1="489" y1="170" x2="105" y2="235" stroke="#34d399" stroke-width="1.2"/>
  <line x1="617" y1="170" x2="105" y2="245" stroke="#34d399" stroke-width="1.2"/>

  <!-- Canonical target -->
  <rect x="20" y="210" width="170" height="50" rx="12" stroke="#34d399" stroke-width="2" fill="none"/>
  <text x="105" y="232" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing="0.3" font-weight="700" fill="#34d399">URL canonico</text>
  <text x="105" y="248" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">/prodotti/scarpe-blu</text>

  <!-- Result -->
  <text x="340" y="288" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e2e8f0">Tutti i segnali di ranking consolidati in un unico URL</text>
</svg>