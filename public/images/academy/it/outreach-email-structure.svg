<svg viewBox="0 0 400 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <text x="200" y="22" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#a78bfa">Struttura e-mail di sensibilizzazione con collegamento interrotto</text>
  <rect x="40" y="40" rx="12" width="320" height="42" stroke="#34d399" stroke-width="1.2" fill="none"/>
  <text x="56" y="56" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#34d399">1</text>
  <text x="72" y="56" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#34d399">Complimento genuino</text>
  <text x="72" y="72" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" fill="#e2e8f0">Fai riferimento a contenuti specifici sulla loro pagina</text>
  <rect x="40" y="92" rx="12" width="320" height="42" stroke="#f87171" stroke-width="1.2" fill="none"/>
  <text x="56" y="108" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f87171">2</text>
  <text x="72" y="108" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#f87171">Segnala collegamento interrotto</text>
  <text x="72" y="124" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e2e8f0">URL esatto + posizione sulla loro pagina</text>
  <rect x="40" y="144" rx="12" width="320" height="42" stroke="#38bdf8" stroke-width="1.2" fill="none"/>
  <text x="56" y="160" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">3</text>
  <text x="72" y="160" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">Suggerire la sostituzione</text>
  <text x="72" y="176" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" fill="#e2e8f0">Di cosa tratta la tua pagina e perché si adatta al loro pubblico</text>
  <text x="200" y="210" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" fill="#f59e0b">Mantieni meno di 120 parole. Non chiedere direttamente un collegamento.</text>
</svg>