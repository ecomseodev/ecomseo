<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" fill="none">
  <!-- Title -->
  <text x="340" y="24" text-anchor="middle" fill="#a78bfa" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" letter-spacing="0.3" font-weight="700">I quattro pilastri del SEO e-commerce</text>

  <!-- Foundation bar -->
  <rect x="60" y="230" width="560" height="36" rx="10" fill="#1a1a2e" stroke="#a78bfa" stroke-width="1.2"/>
