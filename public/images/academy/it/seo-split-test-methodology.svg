<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" fill="none">
  <text x="200" y="20" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#a78bfa">SEO Split Test Methodology</text>
  <!-- Page pool -->
  <rect x="130" y="35" width="140" height="30" rx="9" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="200" y="55" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#38bdf8">1.000 pagine di prodotti simili</text>
  <!-- Split arrows -->
  <path d="M160 65 L80 85" stroke="#34d399" stroke-width="1.2" marker-end="url(#arS1)"/>
  <path d="M240 65 L320 85" stroke="#f59e0b" stroke-width="1.2" marker-end="url(#arS2)"/>
  <!-- Control -->
  <rect x="20" y="88" width="130" height="45" rx="10" stroke="#34d399" stroke-width="1.2"/>
  <text x="85" y="105" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#34d399">Controllo: 500 pagine</text>
  <text x="85" y="120" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#e2e8f0">Modifiche apportate</text>
  <text x="85" y="130" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6" fill="#94a3b8">Anno di riferimento della baseline</text>
  <!-- Variant -->
  <rect x="250" y="88" width="130" height="45" rx="10" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="315" y="105" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f59e0b">Variante: 500 pagine</text>
  <text x="315" y="120" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#e2e8f0">Modifica tag titolo applicata</text>
  <text x="315" y="130" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#94a3b8">Misurare la differenza</text>
  <!-- Timeline -->
  <line x1="50" y1="155" x2="350" y2="155" stroke="#a78bfa" stroke-width="1"/>
  <circle cx="100" cy="155" r="3" fill="#a78bfa"/>
  <text x="100" y="170" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#e2e8f0">pre-test</text>
  <text x="100" y="180" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#94a3b8">2-4 settimane</text>
  <circle cx="200" cy="155" r="3" fill="#f59e0b"/>
  <text x="200" y="170" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" fill="#f59e0b">Nessuna modifica è stata applicata.</text>
  <circle cx="300" cy="155" r="3" fill="#34d399"/>
  <text x="300" y="170" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#e2e8f0">Risultati</text>
  <text x="300" y="180" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#94a3b8">2-6 settimane</text>
  <!-- Significance -->
  <text x="200" y="197" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" fill="#34d399">È richiesta una soglia di confidenza del</text>
  <defs>
    <marker id="arS1" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#34d399"/></marker>
    <marker id="arS2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#f59e0b"/></marker>
  </defs>
</svg>