  <text x="480" y="196" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e2e8f0">3+ combinazioni di filtri</text>

  <rect x="475" y="216" width="160" height="36" rx="8" stroke="#f87171" stroke-width="1" fill="none"/>
  <text x="555" y="232" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700" fill="#f87171">blocco robots.txt</text>
  <text x="555" y="245" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e2e8f0">+ canonico al genitore</text>
