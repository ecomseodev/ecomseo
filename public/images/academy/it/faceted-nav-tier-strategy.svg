  <text x="125" y="205" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e2e8f0">/scarpe/nike/</text>

  <rect x="45" y="222" width="160" height="36" rx="8" stroke="#34d399" stroke-width="1" fill="none"/>
