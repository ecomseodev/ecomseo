  <text x="50" y="156" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e2e8f0">Materiali chiave</text>

  <rect x="45" y="176" width="160" height="36" rx="8" stroke="#34d399" stroke-width="1" fill="none"/>
