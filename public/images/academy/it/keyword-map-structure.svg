  <rect x="145" y="48" width="180" height="30" rx="8" fill="#a78bfa" fill-opacity="0.15"/>
  <text x="235" y="68" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700" fill="#a78bfa">Parola chiave primaria</text>
  <rect x="330" y="48" width="140" height="30" rx="8" fill="#a78bfa" fill-opacity="0.15"/>
  <text x="400" y="68" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700" fill="#a78bfa">Intento</text>
  <rect x="475" y="48" width="80" height="30" rx="8" fill="#a78bfa" fill-opacity="0.15"/>
  <text x="515" y="68" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700" fill="#a78bfa">Volume</text>
  <rect x="560" y="48" width="100" height="30" rx="8" fill="#a78bfa" fill-opacity="0.15"/>
  <text x="610" y="68" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" letter-spacing="0.3" font-weight="700" fill="#a78bfa">Conteggio bersagli</text>
  <!-- Category row -->
  <rect x="20" y="84" width="120" height="36" rx="8" fill="#38bdf8" fill-opacity="0.08" stroke="#38bdf8" stroke-width="1"/>
  <text x="80" y="106" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="600" fill="#38bdf8">Categoria</text>
  <rect x="145" y="84" width="180" height="36" rx="8" fill="#38bdf8" fill-opacity="0.04"/>
  <text x="235" y="106" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#e2e8f0">scarpe da corsa da donna</text>
  <rect x="330" y="84" width="140" height="36" rx="8" fill="#38bdf8" fill-opacity="0.04"/>
  <text x="400" y="106" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#e2e8f0">Commerciale</text>
  <rect x="475" y="84" width="80" height="36" rx="8" fill="#38bdf8" fill-opacity="0.04"/>
  <text x="515" y="106" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#e2e8f0">1K-50K</text>
  <rect x="560" y="84" width="100" height="36" rx="8" fill="#38bdf8" fill-opacity="0.04"/>
  <text x="610" y="106" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#e2e8f0">~50 pagine</text>
  <!-- Product row -->
  <rect x="20" y="126" width="120" height="36" rx="8" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="1"/>
  <text x="80" y="148" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="600" fill="#34d399">Prodotto</text>
  <rect x="145" y="126" width="180" height="36" rx="8" fill="#34d399" fill-opacity="0.04"/>
  <text x="235" y="148" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#e2e8f0">Nike Air Zoom Pegasus 40</text>
  <rect x="330" y="126" width="140" height="36" rx="8" fill="#34d399" fill-opacity="0.04"/>
  <text x="400" y="148" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#e2e8f0">Transazionale</text>
  <rect x="475" y="126" width="80" height="36" rx="8" fill="#34d399" fill-opacity="0.04"/>
  <text x="515" y="148" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#e2e8f0">50-500</text>
  <rect x="560" y="126" width="100" height="36" rx="8" fill="#34d399" fill-opacity="0.04"/>
  <text x="610" y="148" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#e2e8f0">~1.000 pagine</text>
  <!-- Blog row -->
  <rect x="20" y="168" width="120" height="36" rx="8" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-width="1"/>
  <text x="80" y="190" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="600" fill="#f59e0b">Blog/Guida</text>
  <rect x="145" y="168" width="180" height="36" rx="8" fill="#f59e0b" fill-opacity="0.04"/>
  <text x="235" y="190" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#e2e8f0">come scegliere le scarpe da corsa</text>
  <rect x="330" y="168" width="140" height="36" rx="8" fill="#f59e0b" fill-opacity="0.04"/>
  <text x="400" y="190" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#e2e8f0">Informativo</text>
  <rect x="475" y="168" width="80" height="36" rx="8" fill="#f59e0b" fill-opacity="0.04"/>
  <text x="515" y="190" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#e2e8f0">500-5K</text>
  <rect x="560" y="168" width="100" height="36" rx="8" fill="#f59e0b" fill-opacity="0.04"/>
  <text x="610" y="190" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#e2e8f0">~20 pagine</text>
  <!-- Rule box -->
  <rect x="80" y="226" width="520" height="65" rx="12" stroke="#f87171" stroke-width="1.2" fill="#f87171" fill-opacity="0.05"/>
  <text x="340" y="248" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700" fill="#f87171">Una parola chiave primaria = un URL</text>
  <text x="340" y="266" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" fill="#e2e8f0">Ogni parola chiave occupa esattamente un posto. Gli incarichi duplicati causano cannibalizzazione.</text>
  <text x="340" y="282" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" fill="#94a3b8">Aggiungi 2-3 varianti di parole chiave secondarie per pagina per una copertura aggiuntiva.</text>
</svg>