<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" fill="none">
  <text x="340" y="24" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" letter-spacing="0.3" font-weight="700" fill="#a78bfa">Mappa delle parole chiave: dal tipo di pagina all'assegnazione delle parole chiave</text>
  <!-- Header row -->
  <rect x="20" y="48" width="120" height="30" rx="8" fill="#a78bfa" fill-opacity="0.15"/>
