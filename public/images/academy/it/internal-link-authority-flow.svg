<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" fill="none">
  <text x="340" y="24" text-anchor="middle" fill="#a78bfa" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" letter-spacing="0.3" font-weight="700">Distribuzione dell'autorità di collegamento interno</text>

  <!-- Homepage -->
  <rect x="260" y="44" width="160" height="38" rx="12" fill="#1e1e3a" stroke="#34d399" stroke-width="2"/>
  <text x="340" y="67" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" letter-spacing="0.3" font-weight="700">Home page</text>

  <!-- Authority score label -->
  <rect x="430" y="48" width="80" height="28" rx="8" fill="#34d399" fill-opacity="0.1"/>
  <text x="470" y="66" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing="0.3" font-weight="600">Autorità: 100</text>

  <!-- Arrows to categories -->
  <line x1="290" y1="82" x2="160" y2="120" stroke="#34d399" stroke-width="1.2"/>
  <line x1="340" y1="82" x2="340" y2="120" stroke="#34d399" stroke-width="1.2"/>
  <line x1="390" y1="82" x2="520" y2="120" stroke="#34d399" stroke-width="1.2"/>

  <!-- Categories -->
  <rect x="80" y="120" width="160" height="32" rx="10" fill="#1a1a2e" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="160" y="140" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Categoria Scarpe</text>
  <text x="160" y="164" text-anchor="middle" fill="#38bdf8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Autorità: 45</text>

  <rect x="260" y="120" width="160" height="32" rx="10" fill="#1a1a2e" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="340" y="140" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Categoria Abbigliamento</text>
  <text x="340" y="164" text-anchor="middle" fill="#38bdf8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Autorità: 40</text>

  <rect x="440" y="120" width="160" height="32" rx="10" fill="#1a1a2e" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="520" y="140" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Categoria dell'ingranaggio</text>
  <text x="520" y="164" text-anchor="middle" fill="#38bdf8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Autorità: 35</text>

  <!-- Product comparison -->
  <line x1="120" y1="152" x2="90" y2="200" stroke="#475569" stroke-width="1"/>
  <line x1="200" y1="152" x2="230" y2="200" stroke="#475569" stroke-width="1"/>

  <!-- Well-linked product -->
  <rect x="30" y="200" width="120" height="50" rx="9" fill="#1a1a2e" stroke="#34d399" stroke-width="1.2"/>
  <text x="90" y="218" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="600">Prodotto A</text>
  <text x="90" y="232" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">12 collegamenti interni</text>
  <text x="90" y="244" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Autorità: 25</text>

  <!-- Poorly-linked product -->
  <rect x="170" y="200" width="120" height="50" rx="9" fill="#1a1a2e" stroke="#f87171" stroke-width="1.2"/>
  <text x="230" y="218" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="600">Prodotto B</text>
  <text x="230" y="232" text-anchor="middle" fill="#f87171" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">2 collegamenti interni</text>
  <text x="230" y="244" text-anchor="middle" fill="#f87171" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Autorità: 5</text>

  <!-- Link sources for Product A -->
  <rect x="380" y="195" width="270" height="90" rx="10" fill="#1a1a2e" stroke="#334155" stroke-width="1"/>
  <text x="515" y="214" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing="0.3" font-weight="600">Fonti di collegamento del prodotto A (12 in totale)</text>
  <text x="400" y="232" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Sezione in primo piano della home page</text>
  <text x="400" y="246" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Pagina della categoria + 2 sezioni di prodotto correlate</text>
  <text x="400" y="260" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">3 post sul blog + guida all'acquisto</text>
  <text x="400" y="274" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Breadcrumb + navigazione (4 link)</text>

  <!-- Arrow from list to product A -->
  <line x1="380" y1="240" x2="150" y2="225" stroke="#34d399" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- Bottom comparison -->
  <rect x="80" y="300" width="520" height="28" rx="9" fill="#1a1a2e" stroke="#334155" stroke-width="1"/>
  <text x="340" y="318" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Il prodotto A si posiziona al 3° posto per la parola chiave target |  Il prodotto B si classifica alla posizione n. 38</text>
</svg>