<svg viewBox="0 0 400 180" xmlns="http://www.w3.org/2000/svg" fill="none">
  <text x="200" y="20" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#a78bfa">Indexación en dos fases del robot de Google</text>
  <!-- Phase 1 -->
  <rect x="20" y="38" width="160" height="55" rx="10" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="100" y="55" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">Fase 1: recuperación de HTML</text>
  <text x="100" y="70" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">HTML sin procesar rastreado</text>
  <text x="100" y="82" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#34d399">Instante</text>
  <!-- Arrow with delay label -->
  <path d="M185 65 L215 65" stroke="#f59e0b" stroke-width="2" marker-end="url(#arJ)"/>
  <text x="200" y="58" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#f59e0b">Demora:</text>
  <text x="200" y="80" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#f59e0b">segundos en semanas</text>
  <!-- Phase 2 -->
  <rect x="220" y="38" width="160" height="55" rx="10" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="300" y="55" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#a78bfa">Fase 2: Renderizado JS</text>
  <text x="300" y="70" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">Cromo sin cabeza</text>
  <text x="300" y="82" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f87171">tiempo de espera de 5 segundos</text>
  <!-- Limitations -->
  <text x="200" y="115" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0">Limitaciones del robot de Google</text>
  <circle cx="60" cy="140" r="4" stroke="#f87171" stroke-width="1.2" fill="none"/>
  <text x="60" y="140" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#f87171">X</text>
  <text x="60" y="155" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e2e8f0">Sin clics</text>
  <circle cx="150" cy="140" r="4" stroke="#f87171" stroke-width="1.2" fill="none"/>
  <text x="150" y="140" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#f87171">X</text>
  <text x="150" y="155" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e2e8f0">Sin pergaminos</text>
  <circle cx="240" cy="140" r="4" stroke="#f87171" stroke-width="1.2" fill="none"/>
  <text x="240" y="140" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#f87171">X</text>
  <text x="240" y="155" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e2e8f0">Sin formularios</text>
  <circle cx="330" cy="140" r="4" stroke="#f87171" stroke-width="1.2" fill="none"/>
  <text x="330" y="140" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#f87171">X</text>
  <text x="330" y="155" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e2e8f0">Sin geolocalización</text>
  <defs>
    <marker id="arJ" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#f59e0b"/></marker>
  </defs>
</svg>