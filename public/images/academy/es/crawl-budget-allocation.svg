<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" fill="none">
  <!-- Title -->
  <text x="340" y="24" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" letter-spacing="0.3" font-weight="700" fill="#a78bfa">Asignación del presupuesto de rastreo: antes y después de la optimización</text>

  <!-- Before section -->
  <text x="170" y="56" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" letter-spacing="0.3" font-weight="700" fill="#f87171">Antes</text>

  <!-- Before bar: filter pages 85% -->
  <rect x="40" y="72" width="255" height="28" rx="8" stroke="#f87171" stroke-width="1" fill="none"/>
  <rect x="40" y="72" width="255" height="28" rx="8" fill="#f87171" opacity="0.15"/>
  <text x="168" y="90" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing="0.3" font-weight="700" fill="#f87171">Páginas de filtro/parámetros: 85 %</text>

  <!-- Before bar: product pages 10% -->
  <rect x="40" y="108" width="30" height="28" rx="8" stroke="#34d399" stroke-width="1" fill="none"/>
  <rect x="40" y="108" width="30" height="28" rx="8" fill="#34d399" opacity="0.15"/>
  <text x="120" y="126" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#34d399">Páginas de productos: 10%</text>

  <!-- Before bar: other 5% -->
  <rect x="40" y="144" width="15" height="28" rx="8" stroke="#38bdf8" stroke-width="1" fill="none"/>
  <rect x="40" y="144" width="15" height="28" rx="8" fill="#38bdf8" opacity="0.15"/>
  <text x="100" y="162" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#38bdf8">Categorías: 5%</text>

  <!-- Arrow -->
  <line x1="340" y1="80" x2="340" y2="170" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="6"/>
  <text x="340" y="135" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#a78bfa">→</text>

  <!-- After section -->
  <text x="510" y="56" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" letter-spacing="0.3" font-weight="700" fill="#34d399">Después</text>

  <!-- After bar: product pages 55% -->
  <rect x="380" y="72" width="165" height="28" rx="8" stroke="#34d399" stroke-width="1" fill="none"/>
  <rect x="380" y="72" width="165" height="28" rx="8" fill="#34d399" opacity="0.15"/>
  <text x="462" y="90" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing="0.3" font-weight="700" fill="#34d399">Páginas de productos: 55%</text>

  <!-- After bar: categories 25% -->
  <rect x="380" y="108" width="75" height="28" rx="8" stroke="#38bdf8" stroke-width="1" fill="none"/>
  <rect x="380" y="108" width="75" height="28" rx="8" fill="#38bdf8" opacity="0.15"/>
  <text x="480" y="126" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#38bdf8">Categorías: 25%</text>

  <!-- After bar: filter pages 20% -->
  <rect x="380" y="144" width="60" height="28" rx="8" stroke="#f59e0b" stroke-width="1" fill="none"/>
  <rect x="380" y="144" width="60" height="28" rx="8" fill="#f59e0b" opacity="0.15"/>
  <text x="475" y="162" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#f59e0b">Páginas de filtro: 20%</text>

  <!-- Impacto stats -->
  <rect x="80" y="210" width="520" height="70" rx="12" stroke="#a78bfa" stroke-width="1" fill="none"/>
  <text x="340" y="234" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" letter-spacing="0.3" font-weight="700" fill="#a78bfa">Impacto de la reasignación del presupuesto de rastreo</text>
  <text x="180" y="260" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#34d399">+45 % de rastreo de productos</text>
  <text x="340" y="260" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#38bdf8">Indexación un 30 % más rápida</text>
  <text x="500" y="260" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#f59e0b">-65% rastreos desperdiciados</text>
</svg>