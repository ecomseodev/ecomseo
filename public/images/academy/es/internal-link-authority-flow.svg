<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" fill="none">
  <text x="340" y="24" text-anchor="middle" fill="#a78bfa" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" letter-spacing="0.3" font-weight="700">Distribución de autoridad de enlace interno</text>

  <!-- Página principal -->
  <rect x="260" y="44" width="160" height="38" rx="12" fill="#1e1e3a" stroke="#34d399" stroke-width="2"/>
  <text x="340" y="67" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700">Página principal</text>

  <!-- Autoridad score label -->
  <rect x="430" y="48" width="80" height="28" rx="8" fill="#34d399" fill-opacity="0.1"/>
  <text x="470" y="66" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" letter-spacing="0.3" font-weight="600">Autoridad: 100</text>

  <!-- Arrows to categories -->
  <line x1="290" y1="82" x2="160" y2="120" stroke="#34d399" stroke-width="1.2"/>
  <line x1="340" y1="82" x2="340" y2="120" stroke="#34d399" stroke-width="1.2"/>
  <line x1="390" y1="82" x2="520" y2="120" stroke="#34d399" stroke-width="1.2"/>

  <!-- Categorías -->
  <rect x="80" y="120" width="160" height="32" rx="10" fill="#1a1a2e" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="160" y="140" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Categoría de zapatos</text>
  <text x="160" y="164" text-anchor="middle" fill="#38bdf8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Autoridad: 45</text>

  <rect x="260" y="120" width="160" height="32" rx="10" fill="#1a1a2e" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="340" y="140" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Categoría de ropa</text>
  <text x="340" y="164" text-anchor="middle" fill="#38bdf8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Autoridad: 40</text>

  <rect x="440" y="120" width="160" height="32" rx="10" fill="#1a1a2e" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="520" y="140" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Categoría de equipo</text>
  <text x="520" y="164" text-anchor="middle" fill="#38bdf8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Autoridad: 35</text>

  <!-- Producto comparison -->
  <line x1="120" y1="152" x2="90" y2="200" stroke="#475569" stroke-width="1"/>
  <line x1="200" y1="152" x2="230" y2="200" stroke="#475569" stroke-width="1"/>

  <!-- Well-linked product -->
  <rect x="30" y="200" width="120" height="50" rx="9" fill="#1a1a2e" stroke="#34d399" stroke-width="1.2"/>
  <text x="90" y="218" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" letter-spacing="0.3" font-weight="600">Producto A</text>
  <text x="90" y="232" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">12 enlaces internos</text>
  <text x="90" y="244" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Autoridad: 25</text>

  <!-- Pobrely-linked product -->
  <rect x="170" y="200" width="120" height="50" rx="9" fill="#1a1a2e" stroke="#f87171" stroke-width="1.2"/>
  <text x="230" y="218" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" letter-spacing="0.3" font-weight="600">Producto B</text>
  <text x="230" y="232" text-anchor="middle" fill="#f87171" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">2 enlaces internos</text>
  <text x="230" y="244" text-anchor="middle" fill="#f87171" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Autoridad: 5</text>

  <!-- Link sources for Producto A -->
  <rect x="380" y="195" width="270" height="90" rx="10" fill="#1a1a2e" stroke="#334155" stroke-width="1"/>
  <text x="515" y="214" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" letter-spacing="0.3" font-weight="600">Fuentes de enlace del producto A (12 en total)</text>
  <text x="400" y="232" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Sección destacada de la página de inicio</text>
  <text x="400" y="246" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7">Página de categoría + 2 secciones de productos relacionados</text>
  <text x="400" y="260" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">3 publicaciones de blog + guía de compra</text>
  <text x="400" y="274" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Migas de pan + navegación (4 enlaces)</text>

  <!-- Arrow from list to product A -->
  <line x1="380" y1="240" x2="150" y2="225" stroke="#34d399" stroke-width="0.8" stroke-dasharray="4,3"/>

  <!-- Bottom comparison -->
  <rect x="80" y="300" width="520" height="28" rx="9" fill="#1a1a2e" stroke="#334155" stroke-width="1"/>
  <text x="340" y="318" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7">El producto A ocupa la posición número 3 para su palabra clave objetivo |  El producto B ocupa la posición n.º 38</text>
</svg>