<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" fill="none">
  <!-- Title -->
  <text x="340" y="24" text-anchor="middle" fill="#a78bfa" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" letter-spacing="0.3" font-weight="700">Index Bloat: cómo los filtros multiplican las URL</text>

  <!-- Categoría box -->
  <rect x="240" y="44" width="200" height="32" rx="10" fill="#1a1a2e" stroke="#34d399" stroke-width="1.2"/>
  <text x="340" y="64" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="600">/sofás (200 productos)</text>

  <!-- Lines to filters -->
  <line x1="260" y1="76" x2="100" y2="110" stroke="#475569" stroke-width="1"/>
  <line x1="310" y1="76" x2="250" y2="110" stroke="#475569" stroke-width="1"/>
  <line x1="370" y1="76" x2="400" y2="110" stroke="#475569" stroke-width="1"/>
  <line x1="420" y1="76" x2="550" y2="110" stroke="#475569" stroke-width="1"/>

  <!-- Filtrar boxes -->
  <rect x="30" y="110" width="140" height="28" rx="9" fill="#1a1a2e" stroke="#38bdf8" stroke-width="1"/>
  <text x="100" y="128" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Color (10 opciones)</text>

  <rect x="185" y="110" width="140" height="28" rx="9" fill="#1a1a2e" stroke="#38bdf8" stroke-width="1"/>
  <text x="255" y="128" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Materiales (8 opciones)</text>

  <rect x="340" y="110" width="140" height="28" rx="9" fill="#1a1a2e" stroke="#38bdf8" stroke-width="1"/>
  <text x="410" y="128" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Precio (5 rangos)</text>

  <rect x="495" y="110" width="140" height="28" rx="9" fill="#1a1a2e" stroke="#38bdf8" stroke-width="1"/>
  <text x="565" y="128" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Asientos (4 opciones)</text>

  <!-- Multiplication -->
  <text x="340" y="165" text-anchor="middle" fill="#f59e0b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700">10 x 8 x 5 x 4 = 1600 URL de filtro</text>
  <text x="340" y="180" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7">de UNA sola categoría (antes de combinaciones de selección múltiple)</text>

  <!-- Bottom comparison -->
  <rect x="60" y="200" width="250" height="50" rx="10" fill="#f87171" fill-opacity="0.08" stroke="#f87171" stroke-width="1"/>
  <text x="185" y="221" text-anchor="middle" fill="#f87171" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="600">sin control</text>
  <text x="185" y="240" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Más de 1600 URL de bajo valor indexadas</text>

  <rect x="370" y="200" width="250" height="50" rx="10" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="1"/>
  <text x="495" y="221" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="600">Con noindex + canónico</text>
  <text x="495" y="240" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7">Solo se indexan entre 3 y 5 filtros de alta demanda</text>

  <text x="340" y="272" text-anchor="middle" fill="#64748b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7">Utilice etiquetas robots.txt, noindex y canonical para controlar qué combinaciones de filtros indexa Google</text>
</svg>
