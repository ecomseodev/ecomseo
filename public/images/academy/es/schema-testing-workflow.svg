<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" fill="none">
  <!-- Title -->
  <text x="340" y="24" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" letter-spacing="0.3" font-weight="700" fill="#a78bfa">Datos estructurados Probaring and Monitorearing Workflow</text>

  <!-- Paso 1 -->
  <rect x="30" y="52" width="120" height="70" rx="12" stroke="#38bdf8" stroke-width="1.2" fill="none"/>
  <text x="90" y="72" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing="0.3" font-weight="700" fill="#38bdf8">1. Generate</text>
  <text x="90" y="90" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e2e8f0">JSON-LD markup</text>
  <text x="90" y="104" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e2e8f0">in page template</text>

  <line x1="150" y1="87" x2="180" y2="87" stroke="#a78bfa" stroke-width="1.2"/>
  <polygon points="176,83 186,87 176,91" fill="#a78bfa"/>

  <!-- Paso 2 -->
  <rect x="186" y="52" width="120" height="70" rx="12" stroke="#a78bfa" stroke-width="1.2" fill="none"/>
  <text x="246" y="72" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing="0.3" font-weight="700" fill="#a78bfa">2. Válidoar</text>
  <text x="246" y="90" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e2e8f0">Probar de resultados enriquecidos</text>
  <text x="246" y="104" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e2e8f0">+ Válidoador de Schema</text>

  <line x1="306" y1="87" x2="336" y2="87" stroke="#a78bfa" stroke-width="1.2"/>
  <polygon points="332,83 342,87 332,91" fill="#a78bfa"/>

  <!-- Paso 3 -->
  <rect x="342" y="52" width="120" height="70" rx="12" stroke="#34d399" stroke-width="1.2" fill="none"/>
  <text x="402" y="72" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing="0.3" font-weight="700" fill="#34d399">3. Deploy</text>
  <text x="402" y="90" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e2e8f0">Push to production</text>
  <text x="402" y="104" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e2e8f0">across all templates</text>

  <line x1="462" y1="87" x2="492" y2="87" stroke="#a78bfa" stroke-width="1.2"/>
  <polygon points="488,83 498,87 488,91" fill="#a78bfa"/>

  <!-- Paso 4 -->
  <rect x="498" y="52" width="150" height="70" rx="12" stroke="#f59e0b" stroke-width="1.2" fill="none"/>
  <text x="573" y="72" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing="0.3" font-weight="700" fill="#f59e0b">4. Monitorear</text>
  <text x="573" y="90" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e2e8f0">GSC Enhancements</text>
  <text x="573" y="104" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e2e8f0">weekly check</text>

  <!-- Loop back arrow -->
  <line x1="573" y1="122" x2="573" y2="170" stroke="#f87171" stroke-width="1" stroke-dasharray="4"/>
  <line x1="573" y1="170" x2="90" y2="170" stroke="#f87171" stroke-width="1" stroke-dasharray="4"/>
  <line x1="90" y1="170" x2="90" y2="122" stroke="#f87171" stroke-width="1" stroke-dasharray="4"/>
  <text x="340" y="164" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f87171">Errors detected? Fix and re-validate</text>

  <!-- Schedule boxes -->
  <rect x="80" y="192" width="160" height="32" rx="8" stroke="#38bdf8" stroke-width="1" fill="none"/>
  <text x="160" y="212" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#38bdf8">After template changes</text>

  <rect x="260" y="192" width="160" height="32" rx="8" stroke="#f59e0b" stroke-width="1" fill="none"/>
  <text x="340" y="212" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f59e0b">Semanaly GSC check</text>

  <rect x="440" y="192" width="180" height="32" rx="8" stroke="#34d399" stroke-width="1" fill="none"/>
  <text x="530" y="212" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#34d399">Monthly full-site crawl</text>
</svg>