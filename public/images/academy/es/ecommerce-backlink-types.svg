  <text x="360" y="132" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f59e0b">Poco esfuerzo, relevante</text>
  <rect x="50" y="160" rx="10" width="320" height="56" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4" fill="none"/>
  <text x="210" y="180" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e2e8f0">Flujos de autoridad: los enlaces de productos impulsan las páginas comerciales directamente.</text>
  <text x="210" y="196" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e2e8f0">Los enlaces de recursos + marca + proveedores transmiten capital a través de enlaces internos.</text>
</svg>