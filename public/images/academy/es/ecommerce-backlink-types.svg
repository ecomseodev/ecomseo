<svg viewBox="0 0 420 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <text x="210" y="22" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#a78bfa">Tipos de vínculos de retroceso de comercio electrónico</text>
  <line x1="210" y1="44" x2="210" y2="58" stroke="#a78bfa" stroke-width="1.2"/>
  <line x1="60" y1="58" x2="360" y2="58" stroke="#a78bfa" stroke-width="1.2"/>
  <line x1="60" y1="58" x2="60" y2="72" stroke="#a78bfa" stroke-width="1.2"/>
  <line x1="160" y1="58" x2="160" y2="72" stroke="#a78bfa" stroke-width="1.2"/>
