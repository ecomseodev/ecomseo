<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" fill="none">
  <text x="340" y="24" text-anchor="middle" fill="#a78bfa" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" letter-spacing="0.3" font-weight="700">Distribución de autoridad de la página de inicio</text>

  <!-- External backlinks -->
  <rect x="40" y="50" width="120" height="28" rx="9" fill="#1a1a2e" stroke="#f59e0b" stroke-width="1"/>
  <text x="100" y="68" text-anchor="middle" fill="#f59e0b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Enlaces de prensa</text>
  <rect x="40" y="84" width="120" height="28" rx="9" fill="#1a1a2e" stroke="#f59e0b" stroke-width="1"/>
  <text x="100" y="102" text-anchor="middle" fill="#f59e0b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Enlaces de socios</text>
  <rect x="40" y="118" width="120" height="28" rx="9" fill="#1a1a2e" stroke="#f59e0b" stroke-width="1"/>
  <text x="100" y="136" text-anchor="middle" fill="#f59e0b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Enlaces de directorio</text>

  <!-- Arrows to homepage -->
  <line x1="160" y1="64" x2="248" y2="100" stroke="#f59e0b" stroke-width="1"/>
  <line x1="160" y1="98" x2="248" y2="100" stroke="#f59e0b" stroke-width="1"/>
  <line x1="160" y1="132" x2="248" y2="105" stroke="#f59e0b" stroke-width="1"/>

  <!-- Página principal -->
  <rect x="250" y="78" width="180" height="50" rx="12" fill="#1e1e3a" stroke="#34d399" stroke-width="2"/>
  <text x="340" y="100" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" letter-spacing="0.3" font-weight="700">Página principal</text>
  <text x="340" y="116" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Página de máxima autoridad</text>

  <!-- Navegación links down -->
  <line x1="280" y1="128" x2="140" y2="180" stroke="#34d399" stroke-width="1.2"/>
  <line x1="310" y1="128" x2="280" y2="180" stroke="#34d399" stroke-width="1.2"/>
  <line x1="370" y1="128" x2="400" y2="180" stroke="#34d399" stroke-width="1.2"/>
  <line x1="400" y1="128" x2="540" y2="180" stroke="#34d399" stroke-width="1.2"/>

  <!-- Categorías -->
  <rect x="70" y="180" width="140" height="32" rx="9" fill="#1a1a2e" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="140" y="200" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Zapatos para correr</text>

  <rect x="220" y="180" width="120" height="32" rx="9" fill="#1a1a2e" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="280" y="200" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Vestir</text>

  <rect x="350" y="180" width="120" height="32" rx="9" fill="#1a1a2e" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="410" y="200" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Accesorios</text>

  <rect x="480" y="180" width="120" height="32" rx="9" fill="#1a1a2e" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="540" y="200" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Nuevas llegadas</text>

  <!-- Autoridad percentage labels -->
  <text x="140" y="224" text-anchor="middle" fill="#38bdf8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">recibe ~20% del capital</text>
  <text x="280" y="224" text-anchor="middle" fill="#38bdf8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">~20% capital</text>
  <text x="410" y="224" text-anchor="middle" fill="#38bdf8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">~15% capital</text>
  <text x="540" y="224" text-anchor="middle" fill="#38bdf8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">~15% capital</text>

  <!-- Right side: content structure -->
  <rect x="510" y="56" width="150" height="80" rx="9" fill="#1a1a2e" stroke="#334155" stroke-width="1"/>
  <text x="585" y="72" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="600">La página de inicio debe tener</text>
  <text x="585" y="86" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Descriptivo H1</text>
  <text x="585" y="98" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Introducción de 100-200 palabras</text>
  <text x="585" y="110" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Bloques de categorías con enlaces</text>
  <text x="585" y="122" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Sección de marca de 200-400 palabras</text>

  <!-- Advertencia box -->
  <rect x="120" y="250" width="440" height="36" rx="9" fill="#1a1a2e" stroke="#f87171" stroke-width="1"/>
  <text x="340" y="266" text-anchor="middle" fill="#f87171" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="600">Error común: vincular a 200 productos desde la página de inicio</text>
  <text x="340" y="280" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">La autoridad está tan extendida que ningún vínculo tiene un peso significativo</text>

  <text x="340" y="310" text-anchor="middle" fill="#64748b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Mantenga los enlaces de la página de inicio centrados en sus 10 a 15 destinos internos más importantes</text>
</svg>