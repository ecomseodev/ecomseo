<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" fill="none">
  <!-- Title -->
  <text x="340" y="24" text-anchor="middle" fill="#a78bfa" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" letter-spacing="0.3" font-weight="700">Encontrar ganancias rápidas en Google Search Console</text>

  <!-- Position scale -->
  <text x="340" y="52" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Posición en los resultados de búsqueda de Google</text>

  <!-- Position bar -->
  <rect x="60" y="60" width="560" height="24" rx="8" fill="#1a1a2e" stroke="#334155" stroke-width="1"/>

  <!-- Position markers -->
  <text x="83" y="76" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" letter-spacing="0.3" font-weight="600">1</text>
  <text x="120" y="76" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">3</text>
  <text x="177" y="76" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">5</text>
  <text x="290" y="76" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">10</text>
  <text x="330" y="76" fill="#f59e0b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">11</text>
  <text x="560" y="76" fill="#f87171" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">20</text>

  <!-- Zone 1: Top 3 -->
  <rect x="60" y="60" width="80" height="24" rx="8" fill="#34d399" fill-opacity="0.1"/>

  <!-- Zone 2: Positions 5-10 -->
  <rect x="170" y="60" width="140" height="24" rx="8" fill="#38bdf8" fill-opacity="0.1"/>

  <!-- Zone 3: Positions 11-20 -->
  <rect x="320" y="60" width="250" height="24" rx="8" fill="#f59e0b" fill-opacity="0.1"/>

  <!-- Zone descriptions -->
  <!-- Zone: Top 3 -->
  <rect x="40" y="100" width="170" height="70" rx="10" fill="#1a1a2e" stroke="#34d399" stroke-width="1"/>
  <text x="125" y="118" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing="0.3" font-weight="600">Top 3: CTR zona dorada</text>
  <text x="125" y="134" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">CTR: 10-30%</text>
  <text x="125" y="150" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Comprueba: ¿tu CTR está en el punto de referencia?</text>
  <text x="125" y="162" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Solución: mejorar las etiquetas de título y las etiquetas metas</text>

  <!-- Zone: 5-10 -->
  <rect x="225" y="100" width="210" height="70" rx="10" fill="#1a1a2e" stroke="#38bdf8" stroke-width="1"/>
  <text x="330" y="118" text-anchor="middle" fill="#38bdf8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing="0.3" font-weight="600">Posiciones 5-10: victorias rápidas</text>
  <text x="330" y="134" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">CTR: 3-5% (debajo del pliegue)</text>
  <text x="330" y="150" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Pequeño aumento de relevancia = top 3</text>
  <text x="330" y="162" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Solución: profundidad del contenido + etiquetas de título</text>

  <!-- Zone: 11-20 -->
  <rect x="450" y="100" width="190" height="70" rx="10" fill="#1a1a2e" stroke="#f59e0b" stroke-width="1"/>
  <text x="545" y="118" text-anchor="middle" fill="#f59e0b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing="0.3" font-weight="600">Página 2: La mayor ventaja</text>
  <text x="545" y="134" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">CTR: &lt;1% (casi invisible)</text>
  <text x="545" y="150" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Aumento de contenido + enlaces = página 1</text>
  <text x="545" y="162" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Solución: ampliar contenido + vínculos de retroceso</text>

  <!-- Ejemplo calculation -->
  <rect x="100" y="190" width="480" height="60" rx="12" fill="#1a1a2e" stroke="#a78bfa" stroke-width="1"/>
  <text x="340" y="212" text-anchor="middle" fill="#a78bfa" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" letter-spacing="0.3" font-weight="600">Ejemplo: palabra clave con 8000 impresiones mensuales</text>
  <text x="340" y="230" text-anchor="middle" fill="#e2e8f0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Posición 7 = 240 clics/mes</text>
  <text x="340" y="230" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" dx="160">&amp;#8594;</text>
  <text x="340" y="230" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" dx="240" letter-spacing="0.3" font-weight="600">Posición 3 = 1200 clics/mes</text>
  <text x="340" y="244" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">5 veces más tráfico con la misma palabra clave</text>

  <!-- Bottom note -->
  <text x="340" y="280" text-anchor="middle" fill="#64748b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Filtre las consultas de GSC por las posiciones 5 a 20 para encontrar las oportunidades de optimización de mayor impacto</text>
</svg>
