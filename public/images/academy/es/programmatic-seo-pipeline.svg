  <text x="162" y="76" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#e2e8f0">Build</text>
  <text x="162" y="87" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#94a3b8">Conditional logic</text>
  <path d="M210 67 L225 67" stroke="#34d399" stroke-width="1.2" marker-end="url(#arr2)"/>
