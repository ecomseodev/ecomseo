<svg viewBox="0 0 480 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <text x="240" y="22" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#a78bfa">Content Mapped to Buying Journey</text>
  <!-- Funnel stages -->
  <polygon points="60,50 420,50 380,100 100,100" fill="#a78bfa" opacity="0.15" stroke="#a78bfa" stroke-width="1.2"/>
