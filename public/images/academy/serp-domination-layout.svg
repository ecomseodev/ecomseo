<svg viewBox="0 0 380 220" xmlns="http://www.w3.org/2000/svg" fill="none">
  <text x="190" y="20" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#a78bfa">SERP Domination: Multi-Format Visibility</text>
  <!-- SERP mockup -->
  <rect x="60" y="35" width="260" height="170" rx="10" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3"/>
  <!-- Shopping -->
  <rect x="75" y="42" width="230" height="24" rx="7" stroke="#34d399" stroke-width="1.2"/>
  <text x="100" y="58" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#34d399">Shopping</text>
  <text x="225" y="58" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#e2e8f0">+8% CTR</text>
  <!-- Featured Snippet -->
  <rect x="75" y="70" width="230" height="24" rx="7" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="100" y="86" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#a78bfa">Featured Snippet</text>
  <text x="225" y="86" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#e2e8f0">Position 0</text>
  <!-- Organic -->
  <rect x="75" y="98" width="230" height="24" rx="7" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="100" y="114" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#38bdf8">Organic #1</text>
  <text x="225" y="114" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#e2e8f0">+12% CTR</text>
  <!-- Image Pack -->
  <rect x="75" y="126" width="230" height="24" rx="7" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="100" y="142" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#f59e0b">Image Pack</text>
  <text x="225" y="142" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#e2e8f0">+3-5% CTR</text>
  <!-- PAA -->
  <rect x="75" y="154" width="230" height="24" rx="7" stroke="#f87171" stroke-width="1.2"/>
  <text x="100" y="170" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="bold" fill="#f87171">People Also Ask</text>
  <text x="225" y="170" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" fill="#e2e8f0">Brand authority</text>
  <!-- Competitor below fold -->
  <rect x="75" y="182" width="230" height="18" rx="7" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2"/>
  <text x="190" y="195" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" fill="#94a3b8">Competitors pushed below the fold</text>
  <!-- Total -->
  <text x="190" y="216" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="bold" fill="#34d399">Combined: 23-25% of all clicks vs. 12% from organic alone</text>
</svg>