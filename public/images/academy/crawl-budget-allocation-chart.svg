<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg" fill="none">
  <text x="200" y="20" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#a78bfa">Crawl Budget Allocation Analysis</text>
  <!-- Bar chart -->
  <text x="30" y="50" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="end">Products</text>
  <rect x="35" y="40" width="120" height="14" rx="6" fill="#34d399" opacity="0.3"/>
  <rect x="35" y="40" width="120" height="14" rx="6" stroke="#34d399" stroke-width="1" fill="none"/>
  <text x="160" y="51" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#34d399">15% (should be 60%)</text>
  <text x="30" y="72" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="end">Categories</text>
  <rect x="35" y="62" width="80" height="14" rx="6" fill="#38bdf8" opacity="0.3"/>
  <rect x="35" y="62" width="80" height="14" rx="6" stroke="#38bdf8" stroke-width="1" fill="none"/>
  <text x="120" y="73" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#38bdf8">10%</text>
  <text x="30" y="94" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="end">Facets</text>
  <rect x="35" y="84" width="300" height="14" rx="6" fill="#f87171" opacity="0.2"/>
  <rect x="35" y="84" width="300" height="14" rx="6" stroke="#f87171" stroke-width="1" fill="none"/>
  <text x="340" y="95" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#f87171">60% WASTE</text>
  <text x="30" y="116" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="end">Other</text>
  <rect x="35" y="106" width="100" height="14" rx="6" fill="#f59e0b" opacity="0.2"/>
  <rect x="35" y="106" width="100" height="14" rx="6" stroke="#f59e0b" stroke-width="1" fill="none"/>
  <text x="140" y="117" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#f59e0b">15% (search, cart, etc.)</text>
  <!-- Fix arrow -->
  <text x="200" y="148" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#34d399">Fix: Block faceted URLs &#8594; Redirect budget to products</text>
  <!-- Target -->
  <rect x="80" y="160" width="240" height="28" rx="9" stroke="#34d399" stroke-width="1.2" stroke-dasharray="4"/>
  <text x="200" y="178" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">Target: 60% products | 15% categories | 25% other</text>
</svg>