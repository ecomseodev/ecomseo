<svg viewBox="0 0 480 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <text x="240" y="22" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#a78bfa">Veelgestelde vragen Inhoudsarchitectuur</text>
  <!-- Top: Category FAQ pages -->
