  <text x="240" y="148" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#34d399">Veelgestelde vragen over zorg</text>
  <rect x="340" y="115" width="120" height="45" rx="10" fill="#f59e0b" opacity="0.12" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="400" y="135" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f59e0b">Retouren &amp;amp;</text>
  <text x="400" y="148" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f59e0b">Veelgestelde vragen over uitwisselingen</text>
  <!-- Bottom: Product-level FAQs -->
  <line x1="240" y1="160" x2="240" y2="185" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4"/>
  <rect x="100" y="185" width="280" height="40" rx="12" fill="#a78bfa" opacity="0.08" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4"/>
  <text x="240" y="210" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e2e8f0">Veelgestelde vragen op productniveau (3-5 vragen per productpagina)</text>
  <!-- Annotation -->
  <text x="240" y="245" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e2e8f0">Antwoorden: elk 80-150 woorden | FAQPagina JSON-LD op elke pagina</text>
