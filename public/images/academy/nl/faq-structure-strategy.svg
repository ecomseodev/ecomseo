  <text x="80" y="148" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#38bdf8">Veelgestelde vragen over montage</text>
  <rect x="180" y="115" width="120" height="45" rx="10" fill="#34d399" opacity="0.12" stroke="#34d399" stroke-width="1.2"/>
