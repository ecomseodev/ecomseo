  <text x="160" y="51" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#34d399">15% (moet 60%) zijn</text>
  <text x="30" y="72" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="end">Categorieën</text>
  <rect x="35" y="62" width="80" height="14" rx="6" fill="#38bdf8" opacity="0.3"/>
