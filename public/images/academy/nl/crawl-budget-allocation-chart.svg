  <text x="120" y="73" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#38bdf8">10%</text>
  <text x="30" y="94" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="end">Facetten</text>
  <rect x="35" y="84" width="300" height="14" rx="6" fill="#f87171" opacity="0.2"/>
  <rect x="35" y="84" width="300" height="14" rx="6" stroke="#f87171" stroke-width="1" fill="none"/>
  <text x="340" y="95" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#f87171">60% AFVAL</text>
  <text x="30" y="116" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0" text-anchor="end">Ander</text>
  <rect x="35" y="106" width="100" height="14" rx="6" fill="#f59e0b" opacity="0.2"/>
  <rect x="35" y="106" width="100" height="14" rx="6" stroke="#f59e0b" stroke-width="1" fill="none"/>
  <text x="140" y="117" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#f59e0b">15% (zoeken, winkelwagen, etc.)</text>
  <!-- Fix arrow -->
  <text x="200" y="148" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#34d399">Oplossing: gefacetteerde URL's blokkeren &amp;#8594; Verleg budget naar producten</text>
  <!-- Target -->
  <rect x="80" y="160" width="240" height="28" rx="9" stroke="#34d399" stroke-width="1.2" stroke-dasharray="4"/>
  <text x="200" y="178" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">Doelstelling: 60% producten | 15% categorieën | 25% anders</text>
