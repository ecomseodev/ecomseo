<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" fill="none">
  <!-- Title -->
  <text x="340" y="24" text-anchor="middle" fill="#a78bfa" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" letter-spacing="0.3" font-weight="700">Het tweefasige weergaveproces van Google</text>

  <!-- Phase 1 Box -->
  <rect x="20" y="44" width="300" height="220" rx="10" fill="#1a1a2e" stroke="#f87171" stroke-width="1" stroke-opacity="0.5"/>
  <rect x="20" y="44" width="300" height="30" rx="10" fill="#f87171" fill-opacity="0.1"/>
  <rect x="20" y="64" width="300" height="1" fill="#f87171" fill-opacity="0.2"/>
  <text x="170" y="64" text-anchor="middle" fill="#f87171" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700">FASE 1: HTML ophalen</text>

  <text x="170" y="90" text-anchor="middle" fill="#64748b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Gebeurt onmiddellijk</text>

  <!-- What Google receives -->
  <rect x="40" y="105" width="260" height="50" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="170" y="123" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="10">&amp;lt;html&amp;gt;&amp;lt;body&amp;gt;</text>
  <text x="170" y="143" text-anchor="middle" fill="#475569" font-family="monospace" font-size="8">&amp;lt;div id="app"&amp;gt;&amp;lt;/div&amp;gt;</text>

  <!-- What's missing -->
  <rect x="40" y="168" width="260" height="36" rx="10" fill="#f87171" fill-opacity="0.08" stroke="#f87171" stroke-width="0.8"/>
  <text x="170" y="183" text-anchor="middle" fill="#f87171" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7">Geen titel, geen prijs, geen beschrijving</text>
  <text x="170" y="196" text-anchor="middle" fill="#f87171" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Geen recensies, geen schema-opmaak</text>

  <!-- Result -->
  <rect x="40" y="216" width="260" height="32" rx="10" fill="#f87171" fill-opacity="0.15" stroke="#f87171" stroke-width="1"/>
  <text x="170" y="237" text-anchor="middle" fill="#f87171" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700">Google ziet: LEGE PAGINA</text>

  <!-- Arrow between phases -->
  <line x1="330" y1="154" x2="350" y2="154" stroke="#a78bfa" stroke-width="2"/>
  <polygon points="348,148 360,154 348,160" fill="#a78bfa"/>
  <text x="345" y="178" text-anchor="middle" fill="#f59e0b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="600">dagen tot</text>
  <text x="345" y="192" text-anchor="middle" fill="#f59e0b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="600">weken</text>

  <!-- Phase 2 Box -->
  <rect x="360" y="44" width="300" height="220" rx="10" fill="#1a1a2e" stroke="#34d399" stroke-width="1" stroke-opacity="0.5"/>
  <rect x="360" y="44" width="300" height="30" rx="10" fill="#34d399" fill-opacity="0.1"/>
  <rect x="360" y="64" width="300" height="1" fill="#34d399" fill-opacity="0.2"/>
  <text x="510" y="64" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700">FASE 2: JS-weergave</text>

  <text x="510" y="90" text-anchor="middle" fill="#64748b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Vertraagd (weergavewachtrij)</text>

  <!-- What Google renders -->
  <rect x="380" y="105" width="260" height="50" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="510" y="123" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="7">&amp;lt;h1&amp;gt;Hardloopschoenen Pro&amp;lt;/h1&amp;gt;</text>
  <text x="510" y="143" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="7">&amp;lt;span&amp;gt;$ 129,99&amp;lt;/span&amp;gt; Op voorraad</text>

  <!-- What's visible -->
  <rect x="380" y="168" width="260" height="36" rx="10" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="0.8"/>
  <text x="510" y="183" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">Titel, prijs, beschrijving geladen</text>
  <text x="510" y="196" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7">Recensies, schema, weergegeven afbeeldingen</text>

  <!-- Result -->
  <rect x="380" y="216" width="260" height="32" rx="10" fill="#34d399" fill-opacity="0.15" stroke="#34d399" stroke-width="1"/>
  <text x="510" y="237" text-anchor="middle" fill="#34d399" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700">Google ziet: VOLLEDIGE INHOUD</text>

  <!-- Solution bar -->
  <rect x="80" y="282" width="520" height="36" rx="12" fill="#a78bfa" fill-opacity="0.1" stroke="#a78bfa" stroke-width="1"/>
  <text x="340" y="300" text-anchor="middle" fill="#a78bfa" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" letter-spacing="0.3" font-weight="700">Oplossing: Server-Side Rendering (SSR) of Static Generation (SSG)</text>
  <text x="340" y="313" text-anchor="middle" fill="#94a3b8" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7">Elimineert fase 2-vertraging. Google krijgt de volledige inhoud bij de eerste keer ophalen.</text>

  <text x="340" y="336" text-anchor="middle" fill="#64748b" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7">Shopify Liquid = standaard SSR | Next.js/Nuxt = SSR of SSG configureren | React SPA = moet worden gerepareerd</text>
</svg>
