  <rect x="285" y="50" width="80" height="28" rx="8" stroke="#34d399" stroke-width="1.2"/>
  <text x="325" y="68" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#e2e8f0">Gem. positie</text>
  <!-- Comparison -->
  <text x="190" y="102" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" fill="#38bdf8">Werkelijke versus voorspelde prestaties</text>
  <rect x="30" y="112" width="140" height="28" rx="8" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="100" y="130" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#f59e0b">Voorspeld (vanuit controle)</text>
  <text x="190" y="130" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">tegenover</text>
  <rect x="210" y="112" width="140" height="28" rx="8" stroke="#34d399" stroke-width="1.2"/>
  <text x="280" y="130" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#34d399">Actueel (variantgroep)</text>
  <!-- Pitfalls -->
  <text x="190" y="160" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" font-weight="bold" fill="#f87171">Let op: seizoensgebondenheid, algoritme-updates, kannibalisatie, korte duur</text>
  <text x="190" y="175" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" fill="#94a3b8">Documenteer alle resultaten (inclusief storingen) om testkennis op te bouwen</text>
