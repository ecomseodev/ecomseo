  <!-- Bottom note -->
  <text x="340" y="240" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">Als multi-select is ingeschakeld, groeit dit aantal exponentieel tot miljoenen</text>
  <text x="340" y="260" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#34d399">Oplossing: Blokkeer Tier 3-filters, zorg ervoor dat alleen hoogwaardige combinaties indexeerbaar blijven</text>
