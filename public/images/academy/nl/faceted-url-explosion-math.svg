  <text x="340" y="178" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" letter-spacing="0.3" font-weight="700" fill="#f87171">19.200+</text>
