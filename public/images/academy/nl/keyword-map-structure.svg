  <rect x="80" y="226" width="520" height="65" rx="12" stroke="#f87171" stroke-width="1.2" fill="#f87171" fill-opacity="0.05"/>
  <text x="340" y="248" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" letter-spacing="0.3" font-weight="700" fill="#f87171">Eén primair trefwoord = één URL</text>
  <text x="340" y="266" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" fill="#e2e8f0">Elk zoekwoord bevindt zich op precies één stoel. Dubbele opdrachten veroorzaken kannibalisatie.</text>
  <text x="340" y="282" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7" fill="#94a3b8">Voeg twee tot drie secundaire zoekwoordvariaties per pagina toe voor extra dekking.</text>
