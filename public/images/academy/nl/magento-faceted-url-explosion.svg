<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 250" fill="none">
  <text x="210" y="22" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#a78bfa">Facet-URL-explosie in Magento</text>
  <!-- Base category -->
  <rect x="140" y="40" width="140" height="30" rx="10" stroke="#34d399" stroke-width="1.2" fill="none"/>
  <text x="210" y="60" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#34d399">/schoenen.html</text>
  <!-- Attributes -->
  <text x="55" y="95" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#38bdf8">Kleur (10)</text>
  <text x="155" y="95" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#38bdf8">Maat (10)</text>
  <text x="260" y="95" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#38bdf8">Merk (10)</text>
  <text x="365" y="95" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#38bdf8">Prijs (5)</text>
  <!-- Lines from base to attributes -->
  <line x1="180" y1="70" x2="55" y2="85" stroke="#38bdf8" stroke-width="0.8"/>
  <line x1="200" y1="70" x2="155" y2="85" stroke="#38bdf8" stroke-width="0.8"/>
  <line x1="220" y1="70" x2="260" y2="85" stroke="#38bdf8" stroke-width="0.8"/>
  <line x1="240" y1="70" x2="365" y2="85" stroke="#38bdf8" stroke-width="0.8"/>
  <!-- Multiplication -->
  <text x="210" y="122" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#f59e0b">10 x 10 x 10 x 5 = 5.000 URL-combinaties</text>
  <text x="210" y="138" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#e2e8f0">per enkele categoriepagina</text>
  <!-- Solutions -->
  <rect x="20" y="158" width="175" height="40" rx="10" stroke="#34d399" stroke-width="1.2" fill="none"/>
  <text x="107" y="175" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#34d399">Beste: AJAX-filtering</text>
  <text x="107" y="189" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e2e8f0">URL blijft /schoenen.html</text>
  <rect x="225" y="158" width="175" height="40" rx="10" stroke="#f59e0b" stroke-width="1.2" fill="none"/>
  <text x="312" y="175" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#f59e0b">Terugval: noindex + robots.txt</text>
  <text x="312" y="189" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e2e8f0">Blokkeer filterparameters tegen crawlen</text>
  <!-- High-value exception -->
  <rect x="90" y="210" width="240" height="30" rx="10" stroke="#a78bfa" stroke-width="1" fill="none"/>
  <text x="210" y="230" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#a78bfa">Uitzondering: maak speciale landingspagina's voor hoogwaardige filtercombinaties</text>
</svg>