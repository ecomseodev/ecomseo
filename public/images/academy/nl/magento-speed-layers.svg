<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" fill="none">
  <text x="210" y="22" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#a78bfa">Magento snelheidsoptimalisatielagen</text>
  <!-- Varnish layer -->
  <rect x="40" y="44" width="340" height="36" rx="10" stroke="#34d399" stroke-width="1.2" fill="none"/>
  <text x="60" y="60" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#34d399">Vernis volledige paginacache</text>
  <text x="60" y="73" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e2e8f0">Hoogste enkele impact. Serveert HTML in de cache, omzeilt PHP.</text>
  <text x="355" y="67" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#34d399">1</text>
  <!-- JS/CSS layer -->
  <rect x="40" y="88" width="340" height="36" rx="10" stroke="#38bdf8" stroke-width="1.2" fill="none"/>
  <text x="60" y="104" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#38bdf8">JS/CSS samenvoegen + verkleinen</text>
  <text x="60" y="117" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e2e8f0">Inschakelen in Stores &gt; Configuratie &gt; Ontwikkelaar. Voeg kritische CSS-inlining toe.</text>
  <text x="355" y="111" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#38bdf8">2</text>
  <!-- Image layer -->
  <rect x="40" y="132" width="340" height="36" rx="10" stroke="#f59e0b" stroke-width="1.2" fill="none"/>
  <text x="60" y="148" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#f59e0b">WebP-afbeeldingen + Lazy Loading</text>
  <text x="60" y="161" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e2e8f0">WebP met JPEG-fallback. Lazy load onder de gevouwen productroosters.</text>
  <text x="355" y="155" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#f59e0b">3</text>
  <!-- CDN layer -->
  <rect x="40" y="176" width="340" height="36" rx="10" stroke="#a78bfa" stroke-width="1.2" fill="none"/>
  <text x="60" y="192" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#a78bfa">CDN voor statische activa</text>
  <text x="60" y="205" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e2e8f0">Serveer afbeeldingen, CSS en JS vanaf edge-servers bij klanten.</text>
  <text x="355" y="199" text-anchor="end" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#a78bfa">4</text>
  <!-- Before/After -->
  <text x="100" y="232" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#f87171">Voorheen: 4-8s belasting</text>
  <line x1="155" y1="228" x2="260" y2="228" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <polygon points="258,225 264,228 258,231" fill="#e2e8f0"/>
  <text x="330" y="232" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#34d399">Na: onder 2s</text>
</svg>