  <text x="70" y="88" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#e2e8f0">Platform API</text>
  <path d="M125 65 L145 65" stroke="#38bdf8" stroke-width="1.2" marker-end="url(#arW1)"/>
